<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b0710">
<meta name="description" content="Collège La Rivière : appel, cahier de cotes, bulletins officiels, palmarès et rapports aux parents.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shim.js"></script>
<title>Collège La Rivière</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&family=Tinos:wght@400;700&display=swap">
<style>
/* Layout : bandeau en dégradé du logo (brun → orange) avec cercles décoratifs, cartes blanches très arrondies qui le chevauchent, barre d'onglets blanche flottante. */
:root{
  --bg:#14030a; --surface:#22060f; --sunk:#2f0a16; --ink:#ffffff; --muted:rgba(255,255,255,.72); --line:#3d0e1d;
  --accent:#e4677f; --accent-ink:#ffffff; --soft:#4a0c1d; --soft-ink:#f2a9b7;
  --grad:linear-gradient(135deg,#2b0710 0%,#5c0f21 34%,#921733 64%,#c82a4c 88%,#e4677f 100%);
  --grad-soft:linear-gradient(135deg,#2f0a16,#4a0c1d);
  --good:#62d49c; --good-soft:#12321f; --warn:#f2b55c; --warn-soft:#3a2810; --bad:#ff8a80; --bad-soft:#3e1714;
  --shadow:0 14px 34px rgba(0,0,0,.45); --shadow-s:0 4px 16px rgba(0,0,0,.35); color-scheme:dark;
  --r:24px; --r-s:16px;
  --f-d:"Anton","Arial Narrow","Impact",sans-serif;
  --f-b:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14030a; --surface:#22060f; --sunk:#2f0a16; --ink:#ffffff; --muted:rgba(255,255,255,.72); --line:#3d0e1d;
  --accent:#e4677f; --accent-ink:#ffffff; --soft:#4a0c1d; --soft-ink:#f2a9b7; --grad-soft:linear-gradient(135deg,#2f0a16,#4a0c1d);
  --good:#62d49c; --good-soft:#12321f; --warn:#f2b55c; --warn-soft:#3a2810; --bad:#ff8a80; --bad-soft:#3e1714;
  --shadow:0 14px 34px rgba(0,0,0,.45); --shadow-s:0 4px 16px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14030a; --surface:#22060f; --sunk:#2f0a16; --ink:#ffffff; --muted:rgba(255,255,255,.72); --line:#3d0e1d;
  --accent:#e4677f; --accent-ink:#ffffff; --soft:#4a0c1d; --soft-ink:#f2a9b7; --grad-soft:linear-gradient(135deg,#2f0a16,#4a0c1d);
  --good:#62d49c; --good-soft:#12321f; --warn:#f2b55c; --warn-soft:#3a2810; --bad:#ff8a80; --bad-soft:#3e1714;
  --shadow:0 14px 34px rgba(0,0,0,.45); --shadow-s:0 4px 16px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.35;letter-spacing:0;-webkit-tap-highlight-color:transparent;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#4a0c1d}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-d);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em;line-height:1.1}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
svg.i{width:20px;height:20px;flex:none}

/* Bandeau */
.band{position:relative;overflow:hidden;color:#fff;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:22px 112px;border-radius:0 0 38px 38px;
  background:radial-gradient(circle at 18% 104%,transparent 0 92px,rgba(255,255,255,.07) 93px 124px,transparent 125px),radial-gradient(circle at 104% 46%,transparent 0 46px,rgba(255,255,255,.065) 47px 64px,transparent 65px),var(--grad)}
.band::before,.band::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.band::before{width:460px;height:460px;right:-170px;top:-210px;border:64px solid rgba(255,255,255,.085)}
.band::after{width:330px;height:330px;left:-150px;bottom:-230px;border:50px solid rgba(255,255,255,.075)}
.band.home{padding-block:40px 132px}
.band-in{position:relative;z-index:1;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.wide .band-in,.band.wide .band-in{max-width:1500px}
.band-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.band-logo{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.band-school{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.band-school b{font-family:var(--f-d);font-weight:400;font-size:14.5px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band-school span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.role{font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);white-space:nowrap}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.26)}
.kicker{font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;opacity:.8}
.band h1{font-size:clamp(30px,8vw,46px);line-height:1.02;text-transform:uppercase}
.band.home h1{font-size:clamp(36px,10.5vw,60px)}
.band-sub{margin:0;opacity:.92;font-size:15.5px;font-weight:500}
.band.home .band-sub{font-size:16.5px;margin-top:8px;white-space:nowrap}
.band-row{display:flex;align-items:center;gap:16px;justify-content:space-between}
.band-anim{width:clamp(126px,36vw,210px);aspect-ratio:1;flex:none;filter:drop-shadow(0 8px 22px rgba(0,0,0,.45))}
.band.home .band-row{gap:18px;align-items:center}
.bstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bstats span{display:flex;align-items:baseline;gap:6px;background:rgba(255,255,255,.14);border-radius:99px;padding:6px 12px;font-size:13px}
.bstats b{font-family:var(--f-d);font-weight:400;font-size:17px}

/* Page */
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.page-in{position:relative;z-index:2;max-width:1100px;margin:-82px auto 0;display:flex;flex-direction:column;gap:20px}
.page.wide .page-in{max-width:1500px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-s)}
.pad{padding:18px}
.sec{display:flex;flex-direction:column;gap:12px}
.h2{font-size:24px;text-transform:uppercase}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--sunk);color:var(--ink);padding:11px 18px;border-radius:99px;font-weight:700;cursor:pointer;min-height:44px;text-decoration:none}
.btn.grad{background:var(--grad);color:#fff;box-shadow:0 10px 22px rgba(146,23,51,.28)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.sm{padding:7px 13px;min-height:36px;font-size:13.5px}
.btn.big{min-height:56px;font-size:16px;width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
:is(.btn,.iconbtn,.navb,.li,.ccard,.cbtn,.tp,.ctab,.chipb,.seg button,.x,.rrow):focus-visible,input:focus-visible,select:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.x{width:38px;height:38px;border-radius:50%;border:0;background:var(--sunk);cursor:pointer;font-size:20px;line-height:1;flex:none;display:grid;place-items:center;color:var(--ink)}
.x:disabled{opacity:.35;cursor:default}

/* Carte CTA dégradée */
.gcta{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;border:0;cursor:pointer;text-align:left;background:var(--grad);color:#fff;border-radius:22px;padding:20px 20px;min-height:96px;box-shadow:0 14px 30px rgba(146,23,51,.28)}
.gcta::after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-60px;bottom:-110px;border:34px solid rgba(255,255,255,.09)}
.gcta span{flex:1;display:flex;flex-direction:column;gap:3px;position:relative;z-index:1}
.gcta b{font-family:var(--f-d);font-size:26px;font-weight:400;text-transform:uppercase}
.gcta small{font-size:13px;opacity:.85}
.gcta i{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-style:normal}

/* Résumé */
.summary{padding:18px;display:flex;flex-direction:column;gap:16px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.sum3>div{display:flex;flex-direction:column;gap:2px;padding:4px}
.sum3>div+div{border-left:1px solid var(--line)}
.sum3 b{font-family:var(--f-d);font-size:36px;font-weight:400;color:var(--accent);line-height:1.1}
.sum3 span{font-size:12.5px;color:var(--muted);font-weight:600}

/* Fonctions (accueil) */
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.feat{display:flex;gap:14px;align-items:flex-start;padding:16px}
.ib{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--soft);color:var(--soft-ink)}
.ib.g{background:var(--grad);color:#fff}
.feat h3{font-size:19px;margin-bottom:4px}
.feat p{margin:0;font-size:14px;line-height:1.32;color:var(--muted)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.rolec{padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.rolec.dark{background:var(--grad);color:#fff;box-shadow:0 14px 30px rgba(146,23,51,.22)}
.rolec.dark::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;right:-80px;top:-90px;border:36px solid rgba(255,255,255,.08)}
.rolec h3{font-size:21px;display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.rolec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;position:relative;z-index:1}
.rolec li{display:flex;gap:9px;font-size:14px;line-height:1.35}
.rolec li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.rolec.dark li::before{background:#ffd2b8}
.tris{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tric{padding:16px;display:flex;flex-direction:column;gap:10px}
.tric h3{font-size:20px;display:flex;justify-content:space-between;align-items:center}
.tric h3 small{font-family:var(--f-b);font-size:12px;font-weight:700;color:var(--soft-ink);background:var(--soft);padding:3px 9px;border-radius:99px}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:700}
.flow span{background:var(--sunk);border-radius:10px;padding:6px 9px}
.flow span.t{background:var(--grad);color:#fff}
.flow em{font-style:normal;color:var(--muted)}
.rule{display:flex;gap:12px;align-items:center;font-size:13.5px}
.rule .ex{display:flex;gap:6px;flex-wrap:wrap}
.rule .ex span{background:var(--soft);color:var(--soft-ink);font-weight:700;border-radius:99px;padding:4px 10px;font-size:12.5px}

/* Liste des classes */
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.ccard{display:flex;gap:14px;align-items:stretch;border:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-s);padding:14px;text-align:left;cursor:pointer;width:100%;transition:transform .15s ease,box-shadow .15s ease}
.ccard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cnum{position:relative;overflow:hidden;width:78px;flex:none;border-radius:18px;background:var(--grad);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-d);font-weight:400;font-size:32px;line-height:1}
.cnum small{font-family:var(--f-b);font-size:12px;font-weight:600;opacity:.85;margin-top:4px;letter-spacing:0}
.cnum::after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-36px;bottom:-40px;border:14px solid rgba(255,255,255,.1)}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cbody>b{font-family:var(--f-d);font-size:21px;font-weight:400;text-transform:uppercase;line-height:1.05}
.tch{display:flex;align-items:center;gap:9px;background:var(--sunk);border-radius:14px;padding:7px 10px;min-width:0}
.tch>span{display:flex;flex-direction:column;min-width:0;font-weight:600;font-size:13.5px;line-height:1.2}
.tch>span small{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:0}
.tch>span>i{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tch.none{background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:13px}
.cmeta{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.cmeta .row2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;white-space:nowrap}
.cbar{height:7px;border-radius:99px;background:var(--sunk);overflow:hidden}
.cbar i{display:block;height:100%;background:var(--grad);border-radius:99px}
.chev{display:grid;place-items:center;color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-d);font-weight:400;font-size:13px;background:var(--soft);color:var(--soft-ink)}
.av.g{background:var(--grad);color:#fff}
.av.lg{width:62px;height:62px;font-size:21px}

/* Onglets de classe */
.ctabs{display:flex;gap:6px;background:var(--surface);border-radius:20px;padding:6px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:15}
.ctabs::-webkit-scrollbar{display:none}
.ctab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:none;border-radius:15px;padding:11px 14px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.ctab small{font-size:11px;font-weight:800;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.ctab[aria-current="page"]{background:var(--grad);color:#fff;box-shadow:0 8px 18px rgba(146,23,51,.25)}
.ctab[aria-current="page"] small{background:rgba(255,255,255,.22);color:#fff}

/* Listes */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;width:100%;text-align:left;cursor:pointer;border-radius:16px;color:var(--ink)}
.li:hover{background:var(--sunk)}
.li .grow,.grow{flex:1;min-width:0}
.ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.list{padding:6px}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--soft);color:var(--soft-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow-s);border-radius:99px;padding:8px 15px;font-weight:600;font-size:13.5px;cursor:pointer}
.chipb[aria-pressed="true"]{background:var(--grad);color:#fff}
.seg{display:inline-flex;background:var(--sunk);border-radius:99px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:99px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.inp{width:100%;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:14px;padding:10px 14px;min-height:46px}
.inp:focus{box-shadow:inset 0 0 0 2px var(--accent);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--muted)}
.search .inp{padding-left:44px}
.empty{padding:30px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{font-size:17px}
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;padding:8px 8px 8px 14px;border-radius:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:13px;font-weight:600}
.demo .seg{background:rgba(0,0,0,.18)}
.demo .seg button{color:rgba(255,255,255,.8)}
.demo .seg button[aria-pressed="true"]{background:#fff;color:#4a0c1d}
.demo .btn{background:#fff;color:#4a0c1d}
.saved{font-size:12.5px;color:var(--muted);font-weight:600}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;margin:0}
dl.kv dt{color:var(--muted);font-size:13px;font-weight:600}
dl.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.idhead{display:flex;gap:14px;align-items:center}
.tblwrap{overflow-x:auto;border-radius:var(--r-s);background:var(--surface);box-shadow:var(--shadow-s)}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.t th{font-size:12px;letter-spacing:0;color:var(--muted);font-weight:700}
table.t td.name,table.t th.name{text-align:left}
.meter{height:7px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--grad);border-radius:99px}

/* Cahier de cotes */
.tripick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:640px){.tripick{grid-template-columns:repeat(2,1fr)}}
.tp{border:0;background:var(--surface);box-shadow:var(--shadow-s);border-radius:18px;padding:11px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tp b{font-family:var(--f-d);font-weight:400;font-size:18px;text-transform:uppercase}
.tp small{font-size:12px;color:var(--muted);font-weight:600}
.tp[aria-pressed="true"]{background:var(--grad);color:#fff}
.tp[aria-pressed="true"] small{color:rgba(255,255,255,.82)}
.cotes-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:900px){.cotes-grid{grid-template-columns:250px minmax(0,1fr)}.cotes-grid .bulpane{grid-column:1/-1}}
@media (max-width:520px){.etab td .gi{width:44px;height:38px}table.etab th.nm,table.etab td.nm{min-width:96px;max-width:112px;padding-left:6px}.etab td.nm i{display:none}.entry{padding:12px}}
@media (min-width:1280px){.cotes-grid{grid-template-columns:230px minmax(440px,1fr) minmax(0,1.2fr)}.cotes-grid .bulpane{grid-column:auto;position:sticky;top:84px}}
.courses{padding:10px;display:none;flex-direction:column;gap:2px;max-height:calc(100vh - 130px);overflow:auto;position:sticky;top:84px}
@media (min-width:900px){.courses{display:flex}.mcourse{display:none!important}}

/* Barre d'onglets */

/* Intro : fond sombre uni, logo dans une tuile arrondie lumineuse */
.intro{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse 90% 70% at 50% 42%,#1c0610 0%,#0e0307 55%,#060104 100%);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .7s ease,visibility .7s;color-scheme:dark}
.intro.out{opacity:0;visibility:hidden}

.intro-tile{width:min(62vw,300px);aspect-ratio:1;border-radius:34%;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#4a0f22 0%,#2a0712 55%,#1a050c 100%);box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06),0 0 120px rgba(200,42,76,.18)}
.intro-logo{width:74%;aspect-ratio:1;filter:drop-shadow(0 0 18px rgba(255,255,255,.18))}
.intro-name{margin-top:34px;font-family:var(--f-d);font-weight:400;font-size:clamp(30px,8vw,48px);line-height:1;text-transform:uppercase;letter-spacing:.015em;color:#fff}
.intro-motto{margin-top:10px;font-size:clamp(11px,2.9vw,13px);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:500}
@media (prefers-reduced-motion:no-preference){
 .intro-tile{animation:tilein 1.1s cubic-bezier(.2,.9,.3,1.1) both,tileglow 4s ease-in-out 1.2s infinite alternate}
 .intro-name{opacity:0;animation:fadeup .8s ease-out .6s forwards}
 .intro-motto{opacity:0;animation:fadeup .8s ease-out .85s forwards}
}
@keyframes tilein{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes tileglow{from{box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06),0 0 90px rgba(200,42,76,.12)}to{box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06),0 0 150px rgba(200,42,76,.3)}}

@media (prefers-reduced-motion:no-preference){
 .intro .ring-o circle{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.3s cubic-bezier(.6,0,.2,1) .1s forwards}

}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* ===== Bulletin papier, fidèle au modèle officiel ===== */
.ob{--p:#ffffff;--k:#111111;--g:#d6d6d6;--gl:#efefef;--y:#fff6c9;background:var(--p);color:var(--k);border:2px solid var(--k);border-radius:2px;overflow:hidden;font-family:"Roboto Condensed","Arial Narrow",Arial,sans-serif;font-size:12.5px;color-scheme:light}

.dl{display:flex;gap:6px;align-items:baseline;min-width:0;flex:1}

.fait{font-size:12.5px;color:var(--k);font-family:"Tinos","Times New Roman",serif}

.badge-g{font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:99px;background:var(--grad);color:#fff;white-space:nowrap}
.phpick{display:flex;align-items:center;gap:14px}
.ctabs{margin-bottom:26px}
.wbtn{background:#fff;color:#4a0c1d}

.cnum.ph::after{content:"";position:absolute;inset:0;border:0;border-radius:inherit;width:auto;height:auto;background:linear-gradient(180deg,rgba(228,103,127,.10) 0%,transparent 35%,transparent 62%,rgba(20,3,8,.55) 100%),radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(20,3,8,.45) 100%);mix-blend-mode:normal}
.band-ph{filter:contrast(1.12) saturate(.82) brightness(.96) sepia(.14)}

/* ===== Profil enseignant : cartes sombres, ticket pêche à encoches ===== */
.pf-page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;background:var(--bg)}
.prof{--pb:#2b0710;--pc:#3d0a17;--pd:#4a0c1d;--pk:#e4677f;--pk2:#c82a4c;--pi:#fce3e8;--pm:#e0a7b4;--po:#f2a9b7;
  max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;background:var(--pb);color:var(--pi);border-radius:34px;padding:16px;box-shadow:0 20px 50px rgba(20,3,8,.28)}
.pf-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pf-top b{font-family:var(--f-d);font-weight:400;font-size:22px;text-transform:uppercase;letter-spacing:.01em}
.pf-ic{width:46px;height:46px;border-radius:16px;border:0;background:var(--pc);color:var(--pi);display:grid;place-items:center;cursor:pointer;flex:none}
.pf-ic.ghost{background:transparent;cursor:default}
.pf-ic:hover:not(.ghost){background:var(--pd)}
.pf-demo .demo{margin-top:0;background:var(--pc);border-color:transparent}
.ticket{position:relative;background:linear-gradient(160deg,var(--pk),var(--pk2));color:#2b0710;border-radius:26px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.ticket::before,.ticket::after{content:"";position:absolute;top:calc(100% - 84px);width:26px;height:26px;border-radius:50%;background:var(--pb)}
.ticket::before{left:-13px}.ticket::after{right:-13px}
.t-chip{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;background:#2b0710;color:var(--pk);font-weight:700;font-size:13px;padding:7px 13px;border-radius:12px}
.t-row{display:flex;gap:14px;align-items:stretch}
.t-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center}
.t-info small{font-size:12.5px;font-weight:600;opacity:.7}
.t-info h1{font-family:var(--f-d);font-weight:400;font-size:clamp(24px,6.6vw,34px);line-height:1.02;text-transform:uppercase;overflow-wrap:break-word;hyphens:manual}
.t-info span{font-size:14px;font-weight:600;opacity:.85}
.t-photo{width:clamp(104px,30vw,136px);flex:none;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:#2b0710;box-shadow:0 0 0 4px rgba(255,255,255,.55),0 12px 26px rgba(20,3,8,.35);position:relative}
.t-photo img{width:100%;height:100%;object-fit:cover;filter:contrast(1.12) saturate(.82) brightness(.96) sepia(.14)}
.t-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(228,103,127,.1),transparent 40%,rgba(20,3,8,.45));pointer-events:none}
.pf-ini{display:grid;place-items:center;width:100%;height:100%;font-family:var(--f-d);font-size:40px;color:var(--pk)}
.t-cut{border-top:2.5px dashed rgba(20,3,8,.35);margin:4px -4px 0}
.t-stats{display:grid;grid-template-columns:1.25fr .7fr 1fr;gap:8px}
.t-stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.t-stats small{font-size:12px;font-weight:600;opacity:.7}
.t-stats b{font-family:var(--f-d);font-weight:400;font-size:20px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-cta{display:flex;align-items:center;gap:12px;border:0;cursor:pointer;text-align:left;background:var(--pc);color:var(--pi);border-radius:22px;padding:14px 14px 14px 18px}
.pf-cta:hover{background:var(--pd)}
.pf-cta span{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.pf-cta small{font-size:12.5px;color:var(--pm);font-weight:600}
.pf-cta b{font-family:var(--f-d);font-weight:400;font-size:22px;text-transform:uppercase;line-height:1.1}
.pf-cta em{font-style:normal;font-size:12.5px;color:var(--pm)}
.pf-cta i{font-style:normal;display:flex;align-items:center;gap:4px;background:var(--pk);color:#2b0710;font-weight:700;padding:11px 14px;border-radius:14px;white-space:nowrap}
.pf-sec{display:flex;flex-direction:column;gap:10px;background:var(--pc);border-radius:24px;padding:14px}
.pf-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
.pf-h b{font-size:16px;font-weight:700}
.pf-h span{font-size:12.5px;color:var(--pm);font-weight:600}
.pf-link{border:0;background:none;color:var(--pk);font-weight:700;font-size:13px;cursor:pointer}
.pf-list{display:flex;flex-direction:column;gap:8px}
.pf-row{display:flex;align-items:center;gap:12px;background:var(--pd);border-radius:18px;padding:10px 12px}
.pf-row .grow{display:flex;flex-direction:column;min-width:0}
.pf-row .grow b{font-size:14.5px;font-weight:600}
.pf-row .grow small{font-size:12.5px;color:var(--pm)}
.pf-day{width:46px;height:46px;border-radius:14px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--pb);line-height:1}
.pf-day small{font-size:10.5px;font-weight:700;color:var(--pm);text-transform:uppercase}
.pf-day b{font-family:var(--f-d);font-weight:400;font-size:19px}
.pf-day.ic{color:var(--pk)}
.pf-row.ok .pf-day:not(.ic){background:var(--pk);color:#2b0710}.pf-row.ok .pf-day:not(.ic) small{color:#2b0710}
.pf-row.now{box-shadow:inset 0 0 0 2px var(--pk)}
.pf-row.next{opacity:.55}
.pf-chk{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:var(--pk)}
.pf-row.ok .pf-chk{background:rgba(228,103,127,.16)}
.pf-row.miss .pf-chk{box-shadow:inset 0 0 0 2px rgba(224,167,180,.3)}
.pf-tris{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pf-tri{background:var(--pd);border-radius:20px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pf-tri>b{font-size:13px;font-weight:700;line-height:1.15}
.pf-tri>small{font-size:11px;color:var(--pm)}
.pf-tri.done{background:linear-gradient(160deg,var(--pk),var(--pk2));color:#2b0710}.pf-tri.done>small{color:#5c0f21}
.pf-ringw{position:relative;width:64px;height:64px}
.pf-ring{position:absolute;inset:0;transform:rotate(-90deg)}
.pf-ring .rt{fill:none;stroke:rgba(255,255,255,.1);stroke-width:5}
.pf-ring .rf{fill:none;stroke:var(--po);stroke-width:5;stroke-linecap:round}
.pf-tri.done .pf-ring .rt{stroke:rgba(20,3,8,.15)}.pf-tri.done .pf-ring .rf{stroke:#2b0710}
.pf-ringw b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-d);font-weight:400;font-size:15px;line-height:1}
.pf-ringw b small{font-size:10px}
.pf-kids{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.pf-kids::-webkit-scrollbar{display:none}
.pf-kid{flex:none;border:0;background:var(--pd);color:var(--pi);border-radius:22px;padding:8px 8px 10px;width:70px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.pf-kid span{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-d);font-size:18px;background:var(--po);color:#2b0710}
.pf-kid span.f{background:var(--pk)}
.pf-kid small{font-size:11.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-card{background:var(--pd);border-radius:18px;padding:14px;font-size:14px;color:var(--pm)}
.pf-empty{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pf-btn{border:0;background:var(--pk);color:#2b0710;font-weight:700;border-radius:12px;padding:9px 13px;cursor:pointer}
.pf-main{border:0;background:var(--pk);color:#2b0710;font-weight:700;font-size:15.5px;border-radius:18px;padding:15px;cursor:pointer}
.pf-main:hover{background:var(--pk2)}
:is(.pf-ic,.pf-cta,.pf-kid,.pf-link,.pf-btn,.pf-main):focus-visible{outline:2.5px solid var(--pk);outline-offset:2px}
.band-ph.tap{cursor:pointer}
.band-phb{border:0;padding:0;background:none;border-radius:50%;cursor:pointer;flex:none}

/* Ticket en dégradé de l'application (classe et profil) */
.ticket.g,.prof .ticket{background:radial-gradient(circle at 108% -10%,transparent 0 70px,rgba(255,255,255,.14) 71px 96px,transparent 97px),radial-gradient(circle at -8% 120%,transparent 0 60px,rgba(255,255,255,.12) 61px 84px,transparent 85px),var(--grad);color:#fff}
.prof .ticket .t-chip{background:rgba(20,3,8,.55);color:#fce3e8;backdrop-filter:blur(4px)}
.prof .ticket .t-info small,.prof .ticket .t-stats small{opacity:.8}
.prof .ticket .t-cut{border-top-color:rgba(255,255,255,.4)}
.prof .t-photo{box-shadow:0 0 0 4px rgba(255,255,255,.75),0 12px 26px rgba(20,3,8,.45);border:0;padding:0;cursor:pointer}
div.t-photo{cursor:default}
.t-stats.four{grid-template-columns:repeat(4,1fr)}
.prof .pf-cta i{background:var(--grad);color:#fff}
.prof .pf-main,.prof .pf-btn{background:var(--grad);color:#fff}
.prof.wide{max-width:900px}
.pf-page.cl{padding-bottom:0}
.page.flat .page-in{margin-top:18px}
.ctabs.pfx{background:#2b0710;box-shadow:0 12px 30px rgba(20,3,8,.25)}
.ctabs.pfx .ctab{color:#e0a7b4}
.ctabs.pfx .ctab small{background:#4a0c1d;color:#e0a7b4}
.ctabs.pfx .ctab[aria-current="page"]{background:var(--grad);color:#fff}
.t-stats.gs{grid-template-columns:1fr 1.15fr .55fr}

/* Clôtures et activité */
.closebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow-s);border:1.5px solid var(--soft)}
.closebar .grow{display:flex;flex-direction:column;min-width:180px}
.closebar b{font-size:15px}
.closebar small{font-size:12.5px;color:var(--muted)}
.closebar.ok{border-color:var(--good-soft);background:linear-gradient(0deg,var(--good-soft),var(--good-soft)),var(--surface)}
.closebar.ok .cb-ic{background:var(--good);color:#fff}
.closebar.muted{border-color:transparent;font-size:13px;color:var(--muted)}
.cb-ic{width:40px;height:40px;border-radius:14px;flex:none;display:grid;place-items:center;background:var(--soft);color:var(--soft-ink);font-weight:800}
.pa:disabled{cursor:default;opacity:.55}
.pa:disabled.P,.pa:disabled.A{opacity:.8}
.gi.lock{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);cursor:not-allowed}
.navb{position:relative}
.nbadge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:10.5px;font-style:normal;font-weight:800;display:grid;place-items:center}
.actsum{background:var(--sunk)}
.actsum .ttl{white-space:normal}
.act-day{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:6px 4px 0}
.act{background:var(--surface);border-radius:22px;padding:14px;box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:10px}
.act.new{box-shadow:0 0 0 2px var(--accent),var(--shadow-s)}
.act-h{display:flex;align-items:center;gap:12px}
.act-h .grow{display:flex;flex-direction:column;min-width:0}
.act-h b{font-size:15px}
.act-h small{font-size:12.5px;color:var(--muted)}
.act-h .av{width:44px;height:44px}
.act-b{display:flex;gap:6px;flex-wrap:wrap}
.act-l{font-size:13.5px;line-height:1.35}
.act-l small{color:var(--muted);font-weight:600}
.act-d{background:var(--sunk);border-radius:16px;padding:0 12px}
.act-d summary{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;list-style:none}
.act-d summary::-webkit-details-marker{display:none}
.act-d summary .grow{display:flex;flex-direction:column}
.act-d summary small{font-size:12px;color:var(--muted)}
.act-d ol{margin:0 0 10px;padding:0 0 0 20px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.act-d li{display:list-item}
.act-d li span{display:inline}
.act-d li b{float:right;font-weight:700}
.act-d li b.low{color:var(--bad)}
.today-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tg{border:0;color:var(--ink);text-align:left;cursor:pointer;background:var(--sunk);border-radius:14px;padding:9px 10px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.tg:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.tg b{font-size:14px}
.tg span{color:var(--muted);display:flex;align-items:center;gap:6px}
.tg span em{font-style:normal;margin-left:auto;font-size:11.5px;font-weight:700}
.tg span::before,.lg-dot{content:"";width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;display:inline-block}
.tg span.on{color:var(--good);font-weight:700}.tg span.on::before,.lg-dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.tg span.mid{color:var(--warn);font-weight:600}.tg span.mid::before,.lg-dot.mid{background:var(--warn)}
.tg span.blink::before{background:var(--bad)}
@media (prefers-reduced-motion:no-preference){.tg span.blink::before{animation:blinkdot 1.1s ease-in-out infinite}}
@keyframes blinkdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.15;transform:scale(.7)}}
.av.sm{width:34px;height:34px}
.fiche-ph{width:112px;aspect-ratio:3/4;border-radius:20px;object-fit:cover;flex:none;box-shadow:0 0 0 3px var(--surface),0 10px 24px rgba(20,3,8,.25);background:var(--sunk)}
.fiche-ini{width:112px;aspect-ratio:3/4;border-radius:20px;flex:none;display:grid;place-items:center;background:var(--grad);color:#fff;font-family:var(--f-d);font-size:34px}
.pf-kid span img{width:100%;height:100%;object-fit:cover;border-radius:16px}
.pf-kid span.hasph{padding:0;overflow:hidden;background:var(--pd)}

/* Barre de navigation : tuiles carrées flottantes */
.nav{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.nav::before{content:"";position:absolute;inset:-46px 0 0;background:linear-gradient(180deg,transparent,var(--bg) 62%);pointer-events:none;z-index:-1}
.nav-in{max-width:none;background:none;box-shadow:none;padding:0;gap:clamp(8px,2.6vw,14px);justify-content:center}
.navb{flex:0 0 auto;width:clamp(56px,15.5vw,66px);height:clamp(56px,15.5vw,66px);padding:0;border-radius:24px;background:#2b0710;color:#fff;justify-content:center;box-shadow:0 12px 26px rgba(20,3,8,.32),inset 0 0 0 1px rgba(255,255,255,.05);transition:transform .15s ease,background .2s ease}
.navb:hover{transform:translateY(-2px)}
.navb[aria-current="page"]{background:var(--grad);color:#fff;box-shadow:0 12px 26px rgba(146,23,51,.4)}
.navb[aria-current="page"]::after{display:none}
.navb span{display:none}
.navb svg.i{width:28px;height:28px}
.navb[aria-current="page"] svg path[stroke="#2b0710"]{stroke:#921733}
.navb.me img{width:calc(100% - 16px);height:calc(100% - 16px);border-radius:50%;object-fit:cover;box-shadow:0 0 0 2.5px rgba(255,255,255,.22);filter:contrast(1.08) saturate(.85)}
.navb.me[aria-current="page"] img{box-shadow:0 0 0 2.5px #fff}
.nbadge{top:-4px;right:-4px;min-width:22px;height:22px;font-size:11px;box-shadow:0 0 0 3px var(--bg)}
.toast{bottom:calc(104px + env(safe-area-inset-bottom,0px))}

/* Bulletin plein écran */
.bfs{position:fixed;inset:0;z-index:95;background:#1d1a1b;display:flex;flex-direction:column;color:#fff;color-scheme:dark}
.bfs-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:var(--grad)}
.bfs-bar .who{display:flex;flex-direction:column;min-width:0}
.bfs-bar .who small{font-size:12px;opacity:.85}
.bfs-bar .who b{font-family:var(--f-d);font-weight:400;font-size:19px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bfs-ctl{display:flex;align-items:center;gap:6px}
.bfs-ctl .x{background:rgba(255,255,255,.16);color:#fff}
.bfs-ctl .btn{background:rgba(255,255,255,.16);color:#fff}
.zseg{display:inline-flex;align-items:center;background:rgba(0,0,0,.25);border-radius:99px;padding:3px}
.zseg button{width:36px;height:34px;border:0;border-radius:99px;background:none;color:#fff;font-size:20px;font-weight:700;cursor:pointer}
.zseg b{min-width:54px;text-align:center;font-size:13px}
.bfs-body{flex:1;overflow:auto;padding:12px;touch-action:pan-x pan-y;overscroll-behavior:contain}
.bfs-page{width:max-content;margin:0 auto}
.bfs-page .ob{width:max-content}
.bfs-page .ob-scroll{overflow:visible}
.bfs-page .ob-id{grid-template-columns:1fr 1fr}
.bfs-page .ob-id>div+div{border-left:2px solid #111;border-top:0}
/* Pondération */
.pondb{border:0;background:var(--soft);color:var(--soft-ink);font-weight:700;font-size:12px;border-radius:99px;padding:5px 10px;cursor:pointer}
.cg-h{align-items:center}
.cbtn em.pw{display:block;font-style:normal;font-size:11px;font-weight:600;color:var(--muted);margin-top:1px}
.cbtn[aria-current="true"] em.pw{color:rgba(255,255,255,.8)}
table.pond td{text-align:center}
table.pond td:first-child{text-align:left}
.pd-dom td{font-weight:800;text-transform:uppercase;font-size:11.5px;background:var(--sunk);color:var(--muted)}
.pd-br td{font-weight:800;color:var(--soft-ink)}
.pd-c{cursor:pointer}.pd-c:hover td{background:var(--sunk)}
.pd-c.on td{background:var(--soft)}
.pd-c.big td{font-weight:700}
.pd-st td{font-weight:700}
.pd-tot td{font-weight:800;border-top:2px solid var(--ink)}
/* Palmarès */
.chipb.strong{font-weight:800}
.pgroups{display:flex;gap:8px;flex-wrap:wrap}
.pgroups span{background:var(--sunk);border-radius:12px;padding:7px 11px;font-size:13px}
.pgroups span.t{background:var(--grad);color:#fff}
table.palm th small{display:block;font-size:11px;color:var(--soft-ink);font-weight:700}
table.palm td small{display:block;font-size:11px;color:var(--muted)}
table.palm td.tt b{font-family:var(--f-d);font-weight:400;font-size:17px;color:var(--accent)}
table.palm td.name{min-width:170px}
.pnm{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:600}
.rkc span{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;min-width:34px;height:30px;border-radius:99px;background:var(--sunk);font-weight:700;padding:0 6px}
.rkc sup{font-size:9px}

/* Palmarès plein écran et signatures */

.ob.pfs{padding:14px;border-radius:6px;color:#111}

.ob.pfs .pfs-h b{font-family:"Tinos","Times New Roman",serif;text-transform:uppercase;font-size:18px}
.ob.pfs .pfs-h span{font-size:13px}
.ob.pfs table.palm{color:#111;width:max-content;min-width:640px}

.ob.pfs table.palm th small,.ob.pfs table.palm td small{color:#555}

.ob.pfs td.tt b{color:#921733}
.ob.pfs .rkc span{background:#eee;color:#111}.ob.pfs tr.top .rkc span{background:#921733;color:#fff}

.sigimg{height:40px;max-width:120px;background:#fff;border-radius:8px;padding:2px 6px}

function put(col,id,data){

}

const PER={t1:['p1','p2'],t2:['p3','p4'],t3:['p5','p6']};
const EXK={t1:'ex1',t2:'ex2',t3:'ex3'};
const TOF={p1:'t1',p2:'t1',p3:'t2',p4:'t2',p5:'t3',p6:'t3',ex1:'t1',ex2:'t2',ex3:'t3'};
const isNum=x=>typeof x==='number';
const nid=(e,c)=>e+'__'+c;
const noteOf=(eid,cid,t)=>S.notes[nid(eid,cid)]?.[t]||{};
const perLbl=k=>{const n=+k.slice(1);return (n===1?'1re':n+'e')+' P'};
const perLong=k=>{const n=+k.slice(1);return (n===1?'1re':n+'e')+' période'};
function V(eid,c,key){
  if(key==='an'){const a=['t1','t2','t3'].map(t=>V(eid,c,t)).filter(v=>v!=null);return a.length?sum(a):null}
  if(PER[key]){const n=noteOf(eid,c.id,key);const v=[...PER[key],'ex'].map(k=>n[k]).filter(isNum);return v.length?sum(v):null}
  const v=noteOf(eid,c.id,TOF[key])[key.startsWith('ex')?'ex':key];return isNum(v)?v:null}
function MX(c,key){return key[0]==='p'?c.max:key.startsWith('ex')?2*c.max:key==='an'?12*c.max:4*c.max}
function resume(eid,cls,key){let tot=0,any=false,max=0;for(const c of cls.cours||[]){max+=MX(c,key);const v=V(eid,c,key);if(v!=null){tot+=v;any=true}}return{tot:any?tot:null,max,pct:any&&max?tot/max*100:null}}
function places(cid,key){const cls=S.classes[cid];const es=elevesOf(cid);const arr=es.map(e=>[e.id,resume(e.id,cls,key).tot]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);const r={};arr.forEach(([id,v],i)=>{r[id]=i>0&&arr[i-1][1]===v?r[arr[i-1][0]]:i+1});return{r,n:es.length}}
function progression(cid,t){if(!PER[t])t='t1';const cls=S.classes[cid];const es=elevesOf(cid);const C=(cls.cours||[]).length;if(!es.length||!C)return 0;let f=0;for(const e of es)for(const c of cls.cours){const n=noteOf(e.id,c.id,t);f+=[...PER[t],'ex'].filter(k=>isNum(n[k])).length}return f/(es.length*C*3)}
function moyClasse(cid,key){const cls=S.classes[cid];const p=elevesOf(cid).map(e=>resume(e.id,cls,key).pct).filter(v=>v!=null);return p.length?sum(p)/p.length:null}
function courseFill(cid,c,t){const es=elevesOf(cid);if(!es.length)return 0;const ks=PER[t]?[...PER[t],'ex']:['p1','p2','ex','p3','p4','p5','p6'];let f=0,n=0;for(const e of es){if(PER[t]){const nn=noteOf(e.id,c.id,t);for(const k of ks){n++;if(isNum(nn[k]))f++}}else{for(const tt of ['t1','t2','t3']){const nn=noteOf(e.id,c.id,tt);for(const k of [...PER[tt],'ex']){n++;if(isNum(nn[k]))f++}}}}return n?f/n:0}

function bulletinHtml(id,hl){
  const e=S.eleves[id];const cls=S.classes[e.classeId];const g=grilleOf(cls);const ec=S.config.ecole||{};
  const vie=S.notes[nid(id,'vie')]||{};const deg=cls.degre;
  const rg=hl?TRANGE[hl.t]:null;const inR=ci=>rg&&ci>=rg[0]&&ci<=rg[1];
  let ri=0,grp=[];const N=BCOLS.length+1;
  const cellsFor=(courses,rowKey,isHl)=>BCOLS.map((col,ci)=>{
    const cur=isHl&&inR(ci)?' cur':'';
    if(col.m)return `<td class="mx${cur}">${fmt(sum(courses.map(c=>mxCol(c,col.m))))}</td>`;
    const vs=courses.map(c=>V(id,c,col.k)).filter(v=>v!=null);
    return `<td class="pt${col.k[0]==='t'||col.k==='an'?' tt':''}${cur}">${vs.length?fmt(sum(vs)):''}</td>`}).join('');
  const rows=g.map(r=>{
    if(r.t==='dom'){grp=[];return `<tr class="dom"><td colspan="${N}"><span class="stk">${h(r.nom)}</span></td></tr>`}
    if(r.t==='br')return `<tr class="br"><td colspan="${N}"><span class="stk">${h(r.nom)}</span></td></tr>`;
    if(r.t==='st'){const cs=grp;grp=[];return `<tr class="st"><td class="lbl">Sous-total</td>${cellsFor(cs,'s'+(ri++),false)}</tr>`}
    grp.push(r);const isHl=hl&&hl.c===r.id;return `<tr class="${r.big?'big':''}${isHl?' hl':''}"><td class="lbl" title="${h(r.nom)}">${h(r.nom)}</td>${cellsFor([r],'c'+(ri++),isHl)}</tr>`}).join('');
  const all=cls.cours||[];
  const pl={};BCOLS.forEach(c=>{if(c.k)pl[c.k]=places(e.classeId,c.k)});
  const hatch='<td class="hatch"></td>';
  const footRow=(lbl,fn,c2='')=>`<tr class="foot ${c2}"><td class="lbl">${lbl}</td>${BCOLS.map((col,ci)=>fn(col,ci)).join('')}</tr>`;
  const per=col=>col.k&&col.k[0]==='p';
  const vHl=hl&&hl.c==='vie';
  const foot=
    footRow('Maxima généraux',col=>col.m?`<td class="mx">${fmt(sum(all.map(c=>mxCol(c,col.m))))}</td>`:'<td></td>','maxg')+
    footRow('Points obtenus',col=>{if(col.m)return hatch;const t=resume(id,cls,col.k).tot;return `<td class="pt">${t==null?'':fmt(t)}</td>`})+
    footRow('Pourcentage',col=>{if(col.m)return hatch;const p=resume(id,cls,col.k).pct;return `<td class="pt pc">${p==null?'':fmt(p)}</td>`})+
    footRow('Place',col=>col.m?hatch:`<td class="pt">${pl[col.k].r[id]||''}</td>`)+
    footRow('Nbre d’élèves',col=>col.m?hatch:`<td class="pt">${pl[col.k].n}</td>`)+
    footRow('Application',col=>per(col)?`<td class="pt">${h(vie.app?.[col.k]||'')}</td>`:hatch,vHl?'hl':'')+
    footRow('Conduite',col=>per(col)?`<td class="pt">${h(vie.cond?.[col.k]||'')}</td>`:hatch,vHl?'hl':'')+

const SCR='.chips,.ctabs,.pf-kids,.courses,.tripick,.seg';
let lastKey='';
function reveal(box,el,smooth){const c=box.getBoundingClientRect(),r=el.getBoundingClientRect();const o={behavior:smooth?'smooth':'auto'};
  if(box.scrollWidth>box.clientWidth+2&&(r.left<c.left+6||r.right>c.right-6))box.scrollBy({left:(r.left+r.width/2)-(c.left+c.width/2),...o});
  if(box.scrollHeight>box.clientHeight+2&&(r.top<c.top+6||r.bottom>c.bottom-6))box.scrollBy({top:(r.top+r.height/2)-(c.top+c.height/2),...o});}
function keepSelected(prev,key){
  const els=[...document.querySelectorAll('#view :is('+SCR+')')];
  if(prev&&prev.key===key)els.forEach((el,i)=>{const p=prev.pos[i];if(p){el.scrollLeft=p[0];el.scrollTop=p[1]}});
  els.forEach(el=>{const sel=el.querySelector(':scope > [aria-pressed="true"],:scope > [aria-current="page"],:scope > [aria-current="true"]');if(sel)reveal(el,sel,prev&&prev.key===key)});
  const rw=document.getElementById('regwrap'),td=rw?.querySelector('th.today');if(rw&&td&&!(prev&&prev.key===key)){const c=rw.getBoundingClientRect(),r=td.getBoundingClientRect();rw.scrollLeft+=r.left-c.left-(c.width-r.width)/2-60}
}
function render(){
  const key=S.view+'|'+S.ctab+'|'+S.cid;const prevSc={key:lastKey,pos:[...document.querySelectorAll('#view :is('+SCR+')')].map(el=>[el.scrollLeft,el.scrollTop])};
  const keep={};['regwrap','egridw'].forEach(id=>{const el=document.getElementById(id);if(el)keep[id]=el.scrollLeft});
  const ae=document.activeElement,aid=ae&&ae.id&&$('#view').contains(ae)?ae.id:null,selS=ae&&ae.selectionStart;
  $('#view').innerHTML=screen();
  $('#nav').innerHTML=navHtml();
  for(const id in keep){const el=document.getElementById(id);if(el)el.scrollLeft=keep[id]}
  keepSelected(prevSc,key);lastKey=key;
  autoRegistre();
  applyFit();
  if(aid){const el=document.getElementById(aid);if(el){el.focus({preventScroll:true});try{if(selS!=null)el.setSelectionRange(selS,selS)}catch(e){}}}
}
function gated(){return !S.ready||(!S.demo&&!S.me.id)||(!isDir()&&(!S.inscr[meId()]||!mesClasses().length))}
function navHtml(){

function courseMeta(cls){const m={};let dom='',br='';for(const r of grilleOf(cls)){if(r.t==='dom'){dom=r.nom;br=''}else if(r.t==='br')br=r.nom;else if(r.t==='c')m[r.id]={dom,br:r.big?'':br}}return m}
function triPick(){return `<div class="tripick" role="group" aria-label="Trimestre">${['t1','t2','t3','an'].map(t=>`<button class="tp" data-act="tri" data-v="${t}" aria-pressed="${S.tri===t}"><b>${TRI[t]}</b><small>${PER[t]?PER[t].map(perLbl).join(' · ')+' · Examen':'Récapitulatif des 3 trimestres'}</small></button>`).join('')}</div>`}
function courseList(cls,cid){
  let html=`<div class="cg-h"><span>Cours du bulletin <span class="muted">· ${(cls.cours||[]).length}</span></span><button class="pondb" data-act="pond">Pondération</button></div>`;
  for(const r of grilleOf(cls)){
    if(r.t==='dom')html+=`<div class="cg-dom">${h(r.nom.replace(/^Domaine (des|de l’|du|de la) /i,''))}</div>`;
    else if(r.t==='br')html+=`<div class="cg-br">${h(r.nom)}</div>`;
    else if(r.t==='c'){const fl=courseFill(cid,r,S.tri);html+=`<button class="cbtn" data-act="cours" data-id="${h(r.id)}" ${S.cours===r.id?'aria-current="true"':''}><span class="ok ${fl>=1?'on':fl>0?'half':''}">${fl>=1?'✓':fl>0?'•':''}</span><span>${h(r.nom)}<em class="pw num">P /${fmt(r.max)} · Ex /${fmt(2*r.max)} · T /${fmt(4*r.max)}</em></span></button>`}
  }
  html+=`<button class="cbtn vie" data-act="cours" data-id="vie" ${S.cours==='vie'?'aria-current="true"':''}><span class="ok"></span><span>Application et conduite</span></button>`;
  return html;
}
function mobileCourse(cls){
  const all=[...(cls.cours||[]).map(c=>c.id),'vie'];const i=all.indexOf(S.cours);
  let opts='',lbl='',open=false;
  for(const r of grilleOf(cls)){if(r.t==='dom'||r.t==='br'){lbl=r.nom;continue}if(r.t!=='c')continue;if(lbl){if(open)opts+='</optgroup>';opts+=`<optgroup label="${h(lbl)}">`;open=true;lbl=''}opts+=`<option value="${h(r.id)}" ${r.id===S.cours?'selected':''}>${h(r.nom)} (/${fmt(r.max)})</option>`}
  if(open)opts+='</optgroup>';opts+=`<option value="vie" ${S.cours==='vie'?'selected':''}>Application et conduite</option>`;
  return `<div class="field mcourse"><button class="x" data-act="cnav" data-v="-1" ${i<=0?'disabled':''} aria-label="Cours précédent">${ic('left',18)}</button><select class="inp" id="m-cours" data-act="mcours" aria-label="Cours">${opts}</select><button class="x" data-act="cnav" data-v="1" ${i>=all.length-1?'disabled':''} aria-label="Cours suivant">${ic('chev',18)}</button></div>`;
}
function tabCotes(){
  const cid=S.cid,cls=S.classes[cid],es=elevesOf(cid),cours=cls.cours||[];
  if(!cours.length)return `<div class="card empty"><h3>Cette classe n’a pas encore de cours</h3><p class="muted small">La direction applique le modèle du bulletin dans Gestion.</p></div>`;
  if(S.cours!=='vie'&&!cours.find(c=>c.id===S.cours))S.cours=cours[0].id;
  if(!es.find(e=>e.id===S.sel))S.sel=es[0]?.id||'';
  return `${triPick()}${barCotes(cid)}
  <div class="cotes-grid">
   <aside class="card courses" aria-label="Liste des cours">${courseList(cls,cid)}</aside>
   <section class="card entry">${mobileCourse(cls)}${es.length?entryHtml(cls,es):`<div class="empty"><h3>Aucun élève dans cette classe</h3><button class="btn grad" data-act="new-eleve">+ Inscrire un élève</button></div>`}</section>
   ${es.length?bulPane(true):''}
  </div>`;
}
function entryHtml(cls,es){
  const t=S.tri;
  if(S.cours==='vie'){
    const vm=S.vieMode,term6=cls.degre==='term6';const ks=['p1','p2','p3','p4','p5','p6'];
    return `<div class="eh"><span class="path">Bas du bulletin</span><h3>Application et conduite</h3>
     <div class="btns"><div class="seg" role="group" aria-label="Rubrique"><button data-act="viemode" data-v="app" aria-pressed="${vm==='app'}">Application</button><button data-act="viemode" data-v="cond" aria-pressed="${vm==='cond'}">Conduite</button></div><span class="muted small">Écrivez la mention de chaque période (ex. TB, B, AB).</span></div></div>
     <div class="egrid" id="egridw"><table class="etab"><thead><tr><th class="nm">Élève</th><th colspan="2">1er trimestre</th><th colspan="2">2e trimestre</th><th colspan="2">3e trimestre</th>${term6?'<th>Résultat final</th>':''}</tr>
     <tr><th class="nm"></th>${ks.map(k=>`<th>${perLong(k)}</th>`).join('')}${term6?'<th>ENAFEP<small>/50</small></th>':''}</tr></thead><tbody>
     ${es.map((e,n)=>{const v=S.notes[nid(e.id,'vie')]||{};return `<tr data-e="${h(e.id)}" class="${e.id===S.sel?'sel':''}"><td class="nm"><button data-act="selel" data-id="${h(e.id)}"><i>${n+1}</i>${h(e.nom)} ${h(e.prenom||'')}</button></td>${ks.map(k=>`<td><input class="gi txt vi" id="v_${h(e.id)}_${k}" data-e="${h(e.id)}" data-f="${vm}" data-k="${k}" maxlength="6" autocomplete="off" aria-label="${vm==='app'?'Application':'Conduite'} ${perLong(k)}, ${h(nomComplet(e))}" value="${h(v[vm]?.[k]||'')}"></td>`).join('')}${term6?`<td><input class="gi vi" id="en_${h(e.id)}" data-e="${h(e.id)}" data-f="enafep" inputmode="decimal" autocomplete="off" aria-label="ENAFEP sur 50, ${h(nomComplet(e))}" value="${isNum(v.enafep)?fmt(v.enafep):''}"></td>`:''}</tr>`}).join('')}
     </tbody></table></div>
     <div class="ehint"><span>Les mentions apparaissent dans les lignes Application et Conduite du bulletin.</span><span class="saved" id="saved"></span></div>`;
  }
  const c=cls.cours.find(x=>x.id===S.cours);const meta=courseMeta(cls)[c.id]||{};
  const head=`<div class="eh"><span class="path">${h([meta.dom,meta.br].filter(Boolean).join(' › '))}</span><h3>${h(c.nom)}</h3>
   <div class="maxes num"><span>Période /${fmt(c.max)}</span><span>Examen /${fmt(2*c.max)}</span><span class="t">Trimestre /${fmt(4*c.max)}</span><span>Année /${fmt(12*c.max)}</span></div></div>`;
  if(t==='an'){
    return head+`<div class="egrid" id="egridw"><table class="etab"><thead><tr><th class="nm">Élève</th><th>1er trim.</th><th>2e trim.</th><th>3e trim.</th><th>Année</th></tr>
     <tr><th class="nm"></th><th><small>/${fmt(4*c.max)}</small></th><th><small>/${fmt(4*c.max)}</small></th><th><small>/${fmt(4*c.max)}</small></th><th><small>/${fmt(12*c.max)}</small></th></tr></thead><tbody>
     ${es.map((e,n)=>`<tr data-e="${h(e.id)}" class="${e.id===S.sel?'sel':''}"><td class="nm"><button data-act="selel" data-id="${h(e.id)}"><i>${n+1}</i>${h(e.nom)} ${h(e.prenom||'')}</button></td>${['t1','t2','t3'].map(x=>`<td class="ro">${fmt(V(e.id,c,x))}</td>`).join('')}<td class="tt">${fmt(V(e.id,c,'an'))}</td></tr>`).join('')}
     </tbody></table></div><div class="ehint"><span>Récapitulatif en lecture seule. Choisissez un trimestre pour encoder les points.</span></div>`;
  }
  const ks=[...PER[t],EXK[t]];
  return head+`<button class="btn sm" data-act="pond" style="align-self:flex-start">${ic('book',16)} Voir la pondération de tous les cours</button><div class="egrid" id="egridw"><table class="etab"><thead><tr><th class="nm"></th><th colspan="4">${TRI[t]} · ${PER[t].map(perLong).join(' + ')} + examen</th></tr>
   <tr><th class="nm">Élève</th>${ks.map(k=>`<th>${k.startsWith('ex')?'Examen':perLong(k)}<small>/${fmt(MX(c,k))}</small></th>`).join('')}<th>Total<small>/${fmt(4*c.max)}</small></th></tr></thead><tbody>
   ${es.map((e,n)=>`<tr data-e="${h(e.id)}" class="${e.id===S.sel?'sel':''}"><td class="nm"><button data-act="selel" data-id="${h(e.id)}"><i>${n+1}</i>${h(e.nom)} ${h(e.prenom||'')}</button></td>${ks.map(k=>{const v=V(e.id,c,k);const lk=cellLocked(e.id,c.id,k);return `<td><input class="gi${lk?' lock':''}" ${lk?'readonly title="Clôturé : ne se modifie plus"':''} id="g_${h(e.id)}_${k}" data-e="${h(e.id)}" data-k="${k}" inputmode="decimal" autocomplete="off" aria-label="${h(c.nom)}, ${k.startsWith('ex')?'examen':perLong(k)}, ${h(nomComplet(e))}, maximum ${fmt(MX(c,k))}" value="${v==null?'':fmt(v)}"></td>`}).join('')}<td class="tt" id="tt_${h(e.id)}">${fmt(V(e.id,c,t))}</td></tr>`).join('')}
   </tbody></table></div>
   <div class="ehint"><span>Tapez les points puis passez à la case suivante. Ils se reportent tout de suite dans le bulletin.</span><span class="saved" id="saved"></span></div>`;
}
function bulPane(hl){
  const es=elevesOf(S.cid);const i=es.findIndex(e=>e.id===S.sel);const e=es[i];if(!e)return '';
  return `<section class="card bulpane" aria-label="Bulletin de l’élève"><div class="bp-h"><div class="who"><small>${hl?'Bulletin · rempli automatiquement':'Bulletin de l’élève'}</small><b id="bpname">${h(nomComplet(e))}</b></div>
   <div class="elnav"><button class="btn sm grad" data-act="bulfs">${ic('expand',16)} Plein écran</button><span class="muted small num" id="bpidx">${i+1} / ${es.length}</span><button class="x" data-act="bnav" data-v="-1" aria-label="Élève précédent">${ic('left',18)}</button><button class="x" data-act="bnav" data-v="1" aria-label="Élève suivant">${ic('chev',18)}</button></div></div>
   ${hl?`<div class="link-arrow">${ic('arrow',16)} La ligne jaune montre où vont les points du cours choisi.</div>`:''}
   <div class="fitbox" id="bulprev">${bulletinHtml(e.id,hl?{c:S.cours,t:S.tri}:null)}</div></section>`;
}
function refreshBul(){
  const b=$('#bulprev');if(!b)return;const es=elevesOf(S.cid);const i=es.findIndex(e=>e.id===S.sel);const e=es[i];if(!e)return;
  b.innerHTML=bulletinHtml(e.id,S.ctab==='cotes'?{c:S.cours,t:S.tri}:null);
  const n=$('#bpname');if(n)n.textContent=nomComplet(e);const x=$('#bpidx');if(x)x.textContent=`${i+1} / ${es.length}`;
  document.querySelectorAll('.etab tr[data-e]').forEach(tr=>tr.classList.toggle('sel',tr.dataset.e===S.sel));
  document.querySelectorAll('.rrow').forEach(r=>r.setAttribute('aria-current',r.dataset.id===S.sel));
  applyFit();
}
function refreshCotes(){
  const cls=S.classes[S.cid];if(!cls)return;
  if(S.cours!=='vie'&&PER[S.tri]){const c=(cls.cours||[]).find(x=>x.id===S.cours);if(c){
    document.querySelectorAll('.etab input.gi:not(.vi)').forEach(inp=>{if(inp===document.activeElement||inp.classList.contains('bad'))return;const v=V(inp.dataset.e,c,inp.dataset.k);const s=v==null?'':fmt(v);if(inp.value!==s)inp.value=s});
    elevesOf(S.cid).forEach(e=>{const t=document.getElementById('tt_'+e.id);if(t)t.textContent=fmt(V(e.id,c,S.tri))});}}
  document.querySelectorAll('.cbtn[data-id]').forEach(b=>{const c=(cls.cours||[]).find(x=>x.id===b.dataset.id);if(!c)return;const fl=courseFill(S.cid,c,S.tri);const o=b.querySelector('.ok');o.className='ok '+(fl>=1?'on':fl>0?'half':'');o.textContent=fl>=1?'✓':fl>0?'•':''});
  const cb=$('#cbarC');if(cb){const t2=document.createElement('div');t2.innerHTML=barCotes(S.cid);cb.replaceWith(t2.firstElementChild)}
  refreshBul();
}
const gTimers={};
function saveNote(id){const s=$('#saved');if(s)s.textContent='Enregistrement…';clearTimeout(gTimers[id]);gTimers[id]=setTimeout(()=>put('notes',id,S.notes[id]).then(()=>{const s=$('#saved');if(s)s.textContent='✓ Enregistré'}).catch(()=>{}),600)}
function gradeInput(inp){
  if(inp.readOnly)return;
  const eid=inp.dataset.e,el=S.eleves[eid],cls=S.classes[el?.classeId];if(!cls)return;
  if(S.sel!==eid){S.sel=eid}
  if(inp.classList.contains('vi')){
    const id=nid(eid,'vie');const doc=JSON.parse(JSON.stringify(S.notes[id]||{eleveId:eid,classeId:el.classeId,coursId:'vie'}));
    if(inp.dataset.f==='enafep'){const raw=inp.value.trim().replace(',','.');const v=raw===''?null:Number(raw);if(raw!==''&&(isNaN(v)||v<0||v>50)){inp.classList.add('bad');$('#saved').textContent='Maximum 50';return}inp.classList.remove('bad');if(v==null)delete doc.enafep;else doc.enafep=v}
    else{const f=inp.dataset.f,k=inp.dataset.k,v=inp.value.trim();doc[f]=doc[f]||{};if(v)doc[f][k]=v;else delete doc[f][k]}
    S.notes={...S.notes,[id]:doc};saveNote(id);refreshBul();return}
  const c=(cls.cours||[]).find(x=>x.id===S.cours);if(!c)return;
  const key=inp.dataset.k,t=TOF[key],k=key.startsWith('ex')?'ex':key,max=MX(c,key);
  const raw=inp.value.trim().replace(',','.');const v=raw===''?null:Number(raw);
  if(raw!==''&&(isNaN(v)||v<0||v>max)){inp.classList.add('bad');const s=$('#saved');if(s)s.textContent=`Maximum ${fmt(max)} pour cette case`;return}
  inp.classList.remove('bad');
  const id=nid(eid,c.id);const doc=JSON.parse(JSON.stringify(S.notes[id]||{eleveId:eid,classeId:el.classeId,coursId:c.id}));
  doc[t]=doc[t]||{};if(v==null)delete doc[t][k];else doc[t][k]=v;
  if(!isDir()||!doc.log?.[key])doc.log={...(doc.log||{}),[key]:today()};doc.by=meId();
  S.notes={...S.notes,[id]:doc};
  const tt=document.getElementById('tt_'+eid);if(tt)tt.textContent=fmt(V(eid,c,t));
  saveNote(id);refreshBul();
  const cb=$('#cbarC');if(cb){const t2=document.createElement('div');t2.innerHTML=barCotes(S.cid);cb.replaceWith(t2.firstElementChild)}
}

/* ---- Bulletins ---- */
function tabBul(){
  const cid=S.cid,cls=S.classes[cid],key=S.bTri;const es0=elevesOf(cid);
  if(!es0.length)return `<div class="card empty"><h3>Aucun élève dans cette classe</h3><button class="btn grad" data-act="new-eleve">+ Inscrire un élève</button></div>`;
  if(!es0.find(e=>e.id===S.sel))S.sel=es0[0].id;
  const pl=places(cid,key);const es=es0.map(e=>({...e,r:resume(e.id,cls,key),p:pl.r[e.id]})).sort((a,b)=>(a.p??1e9)-(b.p??1e9)||coll.compare(nomComplet(a),nomComplet(b)));
  return `<div class="bul-layout"><aside class="card rank"><div class="sec-h"><b>Classement</b><span class="muted small num">Moy. ${pctf(moyClasse(cid,key))}</span></div>
   <div class="seg" role="group" aria-label="Période du classement">${['t1','t2','t3','an'].map(t=>`<button data-act="btri" data-v="${t}" aria-pressed="${S.bTri===t}">${t==='an'?'Année':t.toUpperCase()}</button>`).join('')}</div>
   <div class="list">${es.map(e=>`<button class="rrow" data-act="selel" data-id="${h(e.id)}" aria-current="${e.id===S.sel}"><span class="rk num">${e.p||'–'}</span>${avEl(e,'sm')}<span class="grow"><span class="ttl" style="display:block">${h(nomComplet(e))}</span><span class="muted small num">${fmt(e.r.tot)} / ${fmt(e.r.max)}</span></span><span class="pill ${e.r.pct==null?'':e.r.pct>=50?'good':'warn'} num">${pctf(e.r.pct)}</span></button>`).join('')}</div></aside>
   ${bulPane(false)}</div>`;
}

/* ---- Élèves de la classe ---- */
function eleveRows(list,showCls){return list.map((e,n)=>{const dn=e.dateNaissance?e.dateNaissance.split('-').reverse().join('/'):'';return `<button class="li" data-act="eleve" data-id="${h(e.id)}">${avEl(e)}<span class="grow"><span class="ttl" style="display:block">${h(nomComplet(e))}</span><span class="muted small">${showCls?h(S.classes[e.classeId]?.nom||'')+' · ':''}${e.sexe==='F'?'Fille':'Garçon'}${dn?' · né(e) le '+dn:''}${e.matricule?' · N° Perm. '+h(e.matricule):''}</span></span><span class="chev">${ic('chev',18)}</span></button>`}).join('')}
function tabEleves(){
  const es=elevesOf(S.cid);
  return `<div class="sec-h"><h2 class="h2">${es.length} élève${es.length>1?'s':''}</h2><button class="btn grad sm" data-act="new-eleve">${ic('plus',18)} Inscrire un élève</button></div>
   ${es.length?`<div class="card list">${eleveRows(es)}</div>`:`<div class="card empty"><h3>Aucun élève inscrit</h3><p class="muted small">Ajoutez le premier élève avec son identité complète.</p></div>`}`;
}

/* ---------- Base de données des élèves ---------- */
function vEleves(){
  const ids=mesClasses();if(S.fCls&&!ids.includes(S.fCls))S.fCls='';
  const q=S.gq.trim().toLowerCase();
  let list=ids.flatMap(c=>elevesOf(c)).filter(e=>!S.fCls||e.classeId===S.fCls);
  if(q)list=list.filter(e=>(nomComplet(e)+' '+(e.matricule||'')).toLowerCase().includes(q));
  return band({back:'accueil',kicker:'Base de données',title:'Les élèves',sub:`${ids.flatMap(c=>elevesOf(c)).length} élèves inscrits`})+page(`
   <div class="card pad stack"><div class="search">${ic('search',18)}<input class="inp" id="gq" type="search" placeholder="Rechercher un nom ou un N° Perm." value="${h(S.gq)}" aria-label="Rechercher un élève"></div>
   <div class="chips" role="group" aria-label="Classe"><button class="chipb" data-act="fcls" data-v="" aria-pressed="${!S.fCls}">Toutes</button>${ids.map(c=>`<button class="chipb" data-act="fcls" data-v="${h(c)}" aria-pressed="${S.fCls===c}">${h(S.classes[c].nom.replace(' année primaire',' année'))}</button>`).join('')}</div></div>
   ${list.length?`<div class="card list">${eleveRows(list,true)}</div>`:`<div class="card empty"><h3>${q?'Aucun élève trouvé':'Aucun élève inscrit'}</h3><p class="muted small">${q?'Essayez un autre nom.':'Les élèves s’inscrivent depuis la page de leur classe.'}</p></div>`}`);
}

/* ---------- Gestion ---------- */

  <section class="sec"><div class="sec-h"><h2 class="h2">Classes et branches</h2><button class="btn sm" data-act="classe" data-id="">${ic('plus',16)} Nouvelle classe</button></div>

  ${ids.length?`<div class="card list">${ids.map(cid=>{const c=S.classes[cid];return `<button class="li" data-act="classe" data-id="${h(cid)}"><span class="ib">${ic('book',20)}</span><span class="grow"><span class="ttl" style="display:block">${h(c.nom)}</span><span class="muted small num">${h(degLabel(c))} · ${(c.cours||[]).length} branches · max. ${fmt(sum((c.cours||[]).map(x=>x.max)))} par période</span></span><span class="chev">${ic('chev',18)}</span></button>`}).join('')}</div>`

const iso=d=>d.toISOString().slice(0,10);
const D=s=>new Date(s+'T00:00:00Z');
function lundi(s){const d=D(s);const w=d.getUTCDay();d.setUTCDate(d.getUTCDate()-((w+6)%7));return iso(d)}
function joursOuvres(debut,n=30){const out=[];const d=D(debut);while(out.length<n){const w=d.getUTCDay();if(w>0&&w<6)out.push(iso(d));d.setUTCDate(d.getUTCDate()+1)}return out}
const aid=(c,d)=>c+'__'+d;
const today=()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`};
const dfr=s=>{const d=D(s);return d.getUTCDate()+' '+MOIS[d.getUTCMonth()]};
function regsOf(cid){return Object.entries(S.regs).filter(([,r])=>r.classeId===cid).map(([id,r])=>({id,...r})).sort((a,b)=>b.debut.localeCompare(a.debut))}
function marque(cid,d,eid){return S.appel[aid(cid,d)]?.p?.[eid]||''}
function tabAppel(){
  const cid=S.cid,regs=regsOf(cid);
  if(!regs.find(r=>r.id===S.aReg))S.aReg=regs[0]?.id||'';
  const reg=regs.find(r=>r.id===S.aReg);
  const head=`<div class="sec-h"><h2 class="h2">Registre d’appel</h2><button class="btn sm" data-act="new-reg">${ic('plus',16)} Nouveau registre</button></div>`;
  if(!reg)return head+`<div class="card empty"><span class="ib g">${ic('check',22)}</span><h3>Aucun registre pour cette classe</h3><p class="muted small">Un registre couvre 30 jours de classe, du lundi au vendredi. Choisissez le lundi où il commence.</p><button class="btn grad" data-act="new-reg">Ouvrir un registre</button></div>`;
  const jours=joursOuvres(reg.debut);const es=elevesOf(cid);
  return head+`<div class="card pad grid2"><div class="field"><label for="a-reg">Registre</label><select class="inp" id="a-reg" data-act="areg">${regs.map(r=>{const j=joursOuvres(r.debut);return `<option value="${h(r.id)}" ${r.id===reg.id?'selected':''}>Du ${dfr(j[0])} au ${dfr(j[29])}</option>`}).join('')}</select></div>
   <div class="field"><label>Affichage</label><div class="seg" role="group" aria-label="Affichage"><button data-act="avue" data-v="reg" aria-pressed="${S.aVue==='reg'}">Registre</button><button data-act="avue" data-v="stats" aria-pressed="${S.aVue==='stats'}">Statistiques</button></div></div></div>
   ${!es.length?`<div class="card empty"><h3>Aucun élève dans cette classe</h3><button class="btn grad" data-act="new-eleve">+ Inscrire un élève</button></div>`:S.aVue==='stats'?statsAppel(cid,jours,es):registre(cid,jours,es)}`;
}
function registre(cid,jours,es){
  const td=today();
  return `${barAppel(cid,jours)}<div class="legend"><span>${isDir()?'La direction peut corriger n’importe quel jour.':'Seule la colonne d’aujourd’hui est modifiable.'} Touchez une case : <b>P</b> présent, puis <b>A</b> absent, puis vide.</span><span>Touchez une date pour marquer présents tous les élèves pas encore notés ce jour-là.</span></div>
  <div class="tblwrap" id="regwrap"><table class="reg"><thead><tr><th class="n">N°</th><th class="name">Nom et postnom</th><th>Sexe</th>
  ${jours.map((d,i)=>{const w=D(d).getUTCDay();return `<th class="d${w===1&&i?' wk':''}${d===td?' today':''}" data-act="jour" data-v="${d}" title="Tous présents le ${dfr(d)}">${JOURS[w]}<b>${D(d).getUTCDate()}</b>${String(D(d).getUTCMonth()+1).padStart(2,'0')}</th>`}).join('')}
  <th class="sum">P</th><th class="sum">A</th><th class="sum">%</th></tr></thead><tbody>
  ${es.map((e,n)=>{let p=0,a=0;const cells=jours.map((d,i)=>{const m=marque(cid,d,e.id);if(m==='P')p++;if(m==='A')a++;const w=D(d).getUTCDay();return `<td class="cell${w===1&&i?' wk':''}"><button class="pa ${m}" ${canEditAppel(cid,d)?'':'disabled'} data-act="pa" data-e="${h(e.id)}" data-d="${d}" aria-label="${h(nomComplet(e))}, ${dfr(d)} : ${m==='P'?'présent':m==='A'?'absent':'non marqué'}">${m}</button></td>`}).join('');
   return `<tr><td class="n num">${n+1}</td><td class="name">${h(e.nom)} ${h(e.postnom||'')}</td><td class="sx">${e.sexe==='F'?'F':'M'}</td>${cells}<td class="sum P num">${p}</td><td class="sum A num">${a}</td><td class="sum num">${p+a?Math.round(p/(p+a)*100):'–'}</td></tr>`}).join('')}
  </tbody></table></div>
  <p class="muted small num" style="margin:0">${jours.length} jours de classe · du ${dfr(jours[0])} au ${dfr(jours[29])} · ${es.length} élèves (${es.filter(e=>e.sexe!=='F').length} G, ${es.filter(e=>e.sexe==='F').length} F)</p>`;
}
function statsAppel(cid,jours,es){
  const mois=[...new Set(jours.map(d=>d.slice(0,7)))];
  if(S.aMois&&!mois.includes(S.aMois))S.aMois='';
  const js=S.aMois?jours.filter(d=>d.startsWith(S.aMois)):jours;
  const tenus=js.filter(d=>es.some(e=>marque(cid,d,e.id)));
  const par=es.map(e=>{let p=0,a=0;for(const d of js){const m=marque(cid,d,e.id);if(m==='P')p++;else if(m==='A')a++}return{e,p,a,t:p+a?p/(p+a)*100:null}});
  const P=sum(par.map(x=>x.p)),A=sum(par.map(x=>x.a));
  const taux=f=>{const s=par.filter(x=>f(x.e));const p=sum(s.map(x=>x.p)),a=sum(s.map(x=>x.a));return{p,a,t:p+a?p/(p+a)*100:null,n:s.length}};
  const G=taux(e=>e.sexe!=='F'),F=taux(e=>e.sexe==='F');
  const jourTaux=tenus.map(d=>{let p=0,a=0;for(const e of es){const m=marque(cid,d,e.id);if(m==='P')p++;else if(m==='A')a++}return{d,p,a,t:p+a?p/(p+a)*100:0}});
  const surv=par.filter(x=>x.t!=null&&x.t<80).sort((a,b)=>a.t-b.t);
  const nomMois=m=>MOIS[+m.slice(5)-1];const cap=m=>nomMois(m).replace(/^./,c=>c.toUpperCase());
  const chips=`<div class="chips" role="group" aria-label="Mois"><button class="chipb" data-act="amois" data-v="" aria-pressed="${!S.aMois}">Tout le registre</button>${mois.map(m=>`<button class="chipb" data-act="amois" data-v="${m}" aria-pressed="${S.aMois===m}">${cap(m)}</button>`).join('')}</div>`;
  if(!tenus.length)return chips+`<div class="card empty"><h3>Pas encore d’appel ${S.aMois?'en '+nomMois(S.aMois):'dans ce registre'}</h3><p class="muted small">Les statistiques apparaissent dès le premier jour d’appel.</p><button class="btn grad" data-act="avue" data-v="reg">Faire l’appel</button></div>`;
  return chips+`<div class="kpis num"><div class="card kpi acc"><b>${pctf(P+A?P/(P+A)*100:null)}</b><span>Taux de présence</span></div>
   <div class="card kpi good"><b>${P}</b><span>Présences</span></div><div class="card kpi bad"><b>${A}</b><span>Absences</span></div>
   <div class="card kpi"><b>${tenus.length}<small class="muted" style="font-size:15px"> / ${js.length}</small></b><span>Jours d’appel tenus</span></div></div>
  <div class="split num"><div class="card kpi"><span>Garçons (${G.n})</span><b style="font-size:20px">${pctf(G.t)}</b><span>${G.p} P · ${G.a} A</span></div><div class="card kpi"><span>Filles (${F.n})</span><b style="font-size:20px">${pctf(F.t)}</b><span>${F.p} P · ${F.a} A</span></div></div>
  <section class="card pad sec"><div class="sec-h"><h2 class="h2" style="font-size:16px">Présence par jour</h2><span class="muted small num">Moyenne ${pctf(sum(jourTaux.map(j=>j.t))/jourTaux.length)}</span></div>
   <div class="bars" role="img" aria-label="Taux de présence pour chaque jour d’appel"><div class="gridline" style="bottom:46.7%">50 %</div><div class="gridline" style="bottom:93.3%">100 %</div>
    ${jourTaux.map(j=>`<div class="b${j.t<80?' low':''}" tabindex="0" data-tip="${dfr(j.d)} : ${Math.round(j.t)} % de présence (${j.p} P, ${j.a} A)" title="${dfr(j.d)} : ${Math.round(j.t)} %"><i style="height:${Math.max(2,j.t*0.933)}%"></i></div>`).join('')}</div>
   <div class="bars-axis"><span>${dfr(jourTaux[0].d)}</span><span>${dfr(jourTaux[jourTaux.length-1].d)}</span></div>
   <div class="tip muted small" id="tip">Touchez une barre pour voir le détail du jour. En rouge : moins de 80 % de présence.</div></section>
  ${surv.length?`<section class="sec"><div class="sec-h"><h2 class="h2" style="font-size:16px">Élèves à suivre</h2><span class="pill warn">moins de 80 %</span></div><div class="card list">${surv.map(x=>`<div class="row"><span class="av">${h(initials(x.e))}</span><div class="grow"><div class="ttl">${h(nomComplet(x.e))}</div><div class="muted small num">${x.a} absence${x.a>1?'s':''} sur ${x.p+x.a} jours</div></div><span class="pill warn num">${pctf(x.t)}</span></div>`).join('')}</div></section>`:''}
  <section class="sec"><h2 class="h2" style="font-size:16px">Détail par élève</h2>
  <div class="tblwrap"><table class="t"><thead><tr><th>N°</th><th class="name">Élève</th><th>Sexe</th><th>P</th><th>A</th><th>Taux</th></tr></thead><tbody>
  ${par.map((x,i)=>`<tr><td class="muted">${i+1}</td><td class="name">${h(x.e.nom)} ${h(x.e.postnom||'')}</td><td>${x.e.sexe==='F'?'F':'M'}</td><td style="color:var(--good);font-weight:700">${x.p}</td><td style="color:var(--bad);font-weight:700">${x.a}</td><td><div style="display:flex;align-items:center;gap:6px;justify-content:flex-end"><div class="meter" style="width:48px"><i style="width:${x.t??0}%"></i></div><b>${x.t==null?'–':Math.round(x.t)+' %'}</b></div></td></tr>`).join('')}
  </tbody></table></div></section>`;
}

const aTimers={};
function marquer(cid,d,eids,val){
  const id=aid(cid,d);const doc=JSON.parse(JSON.stringify(S.appel[id]||{classeId:cid,date:d,p:{}}));
  for(const e of eids){if(val==null){const cur=doc.p[e]||'';const nx=cur===''?'P':cur==='P'?'A':'';if(nx)doc.p[e]=nx;else delete doc.p[e]}else if(!doc.p[e])doc.p[e]=val}
  doc.by=meId();S.appel={...S.appel,[id]:doc};render();
  clearTimeout(aTimers[id]);aTimers[id]=setTimeout(()=>put('appel',id,S.appel[id]).catch(()=>{}),500);
}

/* ---------- Palmarès ---------- */
const PKEYS=[['p1','1re P'],['p2','2e P'],['ex1','Ex. 1'],['t1','1er trim.'],['p3','3e P'],['p4','4e P'],['ex2','Ex. 2'],['t2','2e trim.'],['p5','5e P'],['p6','6e P'],['ex3','Ex. 3'],['t3','3e trim.'],['an','Année']];
function groupes(cls){const m={};let br='';for(const r of grilleOf(cls)){if(r.t==='dom')br='';else if(r.t==='br')br=r.nom;else if(r.t==='c'){if(r.big)m[r.id]=/fran/i.test(r.nom)?'fr':'cg';else m[r.id]=/^fran/i.test(br)?'fr':/^math/i.test(br)?'ma':'cg'}}return m}
const GRP=[['fr','Français'],['ma','Mathématiques'],['cg','Culture générale']];
function palmData(cid,key){const cls=S.classes[cid];const es=elevesOf(cid);const gm=groupes(cls);
  const mx={fr:0,ma:0,cg:0};for(const c of cls.cours||[])mx[gm[c.id]]+=MX(c,key);const MT=mx.fr+mx.ma+mx.cg;
  const rows=es.map(e=>{const g={fr:null,ma:null,cg:null};for(const c of cls.cours||[]){const v=V(e.id,c,key);if(v!=null){const k=gm[c.id];g[k]=(g[k]||0)+v}}const any=GRP.some(([k])=>g[k]!=null);const tot=any?(g.fr||0)+(g.ma||0)+(g.cg||0):null;return{e,g,tot,pct:tot==null?null:tot/MT*100}});
  const ranked=rows.filter(r=>r.tot!=null).sort((a,b)=>b.tot-a.tot);let rk=0,prev=null;ranked.forEach((r,i)=>{if(r.tot!==prev){rk=i+1;prev=r.tot}r.p=rk});
  return{mx,MT,ranked,list:[...ranked,...rows.filter(r=>r.tot==null)],n:es.length}}

   ${list.map(r=>{const s=sigOf(r.e.id,key);return `<tr class="${r.p&&r.p<=3?'top':''}"><td class="rkc num">${r.p?`<span>${r.p}<sup>${r.p===1?'er':'e'}</sup></span>`:'–'}</td><td class="name">${paper?`<span class="pnm">${avEl(r.e,'sm')}<span>${h(nomComplet(r.e))}</span></span>`:`<button class="pnm" data-act="eleve" data-id="${h(r.e.id)}">${avEl(r.e,'sm')}<span>${h(nomComplet(r.e))}</span></button>`}</td>${GRP.map(([k])=>cell(r.g[k],mx[k]||1)).join('')}<td class="num tt"><b>${r.tot==null?'–':fmt(r.tot)}</b></td><td class="num"><span class="pill ${r.pct==null?'':r.pct>=50?'good':'warn'}">${pctf(r.pct)}</span></td><td>${s?`<span class="pill good">✓ Signé</span>`:`<span class="pill">Non signé</span>`}</td></tr>`}).join('')}
