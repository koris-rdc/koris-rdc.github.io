function cotesDuJour(cid,d){const cls=S.classes[cid];if(!cls)return[];const items={};
  for(const n of Object.values(S.notes)){if(n.classeId!==cid||!n.log)continue;const e=S.eleves[n.eleveId];if(!e)continue;const c=(cls.cours||[]).find(x=>x.id===n.coursId);if(!c)continue;
    for(const [k,dd] of Object.entries(n.log)){if(dd!==d)continue;const ik=c.id+'|'+k;(items[ik]=items[ik]||{cours:c.id,nom:c.nom,key:k,max:MX(c,k),eleves:[]}).eleves.push({nom:nomComplet(e),pts:V(n.eleveId,c,k)})}}
  return Object.values(items).map(it=>({...it,eleves:it.eleves.sort((a,b)=>coll.compare(a.nom,b.nom))}))}
const keyLbl=k=>k.startsWith('ex')?'Examen du '+TRI['t'+k.slice(2)]:perLong(k);
async function closeAppel(cid,d,auto){const r=appelResume(cid,d);const j=JR(cid,d)||{classeId:cid,date:d};await put('journal',jid(cid,d),{...j,appel:{at:new Date().toISOString(),by:auto?(j.appel?.by||teachersOf(cid)[0]?.id||''):meId(),auto:!!auto,P:r.P,A:r.A,absents:r.absents,n:r.n}})}
async function closeCotes(cid,d,auto){const items=cotesDuJour(cid,d);const j=JR(cid,d)||{classeId:cid,date:d};await put('journal',jid(cid,d),{...j,cotes:{at:new Date().toISOString(),by:auto?(teachersOf(cid)[0]?.id||''):meId(),auto:!!auto,items}})}
let autoBusy=false;
async function autoClose(){
  if(autoBusy||!S.ready)return;autoBusy=true;
  try{const td=today();
    for(const cid of mesClasses()){
      const dates=new Set();
      for(const n of Object.values(S.notes))if(n.classeId===cid&&n.log)for(const d of Object.values(n.log))if(d<td)dates.add(d);
      for(const [k,a] of Object.entries(S.appel))if(a.classeId===cid&&a.date<td&&Object.keys(a.p||{}).length)dates.add(a.date);
      for(const d of [...dates].sort()){
        if(!appelClos(cid,d)&&Object.keys(S.appel[aid(cid,d)]?.p||{}).length)await closeAppel(cid,d,true).catch(()=>{});
        if(!cotesClos(cid,d)&&cotesDuJour(cid,d).length)await closeCotes(cid,d,true).catch(()=>{});
      }
    }
  }finally{autoBusy=false}
}
setInterval(autoClose,10*60*1000);

/* Barres de clôture dans la classe */
function barAppel(cid,jours){
  const td=today();if(!jours.includes(td))return isDir()?'':`<div class="closebar muted">L’appel ne peut se faire que le jour même. Aujourd’hui ne fait pas partie de ce registre.</div>`;
  const r=appelResume(cid,td);const j=JR(cid,td)?.appel;
  if(j)return `<div id="cbarA" class="closebar ok"><span class="cb-ic">✓</span><span class="grow"><b>Appel du jour clôturé à ${hm(j.at)}</b><small>${j.P} présent${j.P>1?'s':''} · ${j.A} absent${j.A>1?'s':''}${j.auto?' · clôture automatique':''}</small>${(g=>`<span class="gfrow num"><span><i class="gb">G</i> ${g.PG} P · ${g.AG} A</span><span><i class="gf">F</i> ${g.PF} P · ${g.AF} A</span></span>`)(gfSplit(cid,td))}</span></div>`;
  if(isDir())return `<div id="cbarA" class="closebar"><span class="cb-ic">•</span><span class="grow"><b>Appel du jour pas encore clôturé</b><small>${r.n-r.reste} élève${r.n-r.reste>1?'s':''} marqué${r.n-r.reste>1?'s':''} sur ${r.n}</small></span></div>`;
  return `<div id="cbarA" class="closebar"><span class="cb-ic">${ic('check',20)}</span><span class="grow"><b>Appel d’aujourd’hui · ${dfr(td)}</b><small>${r.reste?`Il reste ${r.reste} élève${r.reste>1?'s':''} à marquer avant de clôturer.`:'Tous les élèves sont marqués.'}</small></span><button class="btn grad sm" data-act="close-appel" ${r.reste?'disabled':''}>Clôturer la journée</button></div>`;
}
function barCotes(cid){
  const td=today();const items=cotesDuJour(cid,td);const j=JR(cid,td)?.cotes;const n=sum(items.map(i=>i.eleves.length));
  if(j)return `<div id="cbarC" class="closebar ok"><span class="cb-ic">✓</span><span class="grow"><b>Cotes du jour clôturées à ${hm(j.at)}</b><small>${sum(j.items.map(i=>i.eleves.length))} cote${sum(j.items.map(i=>i.eleves.length))>1?'s':''} envoyée${sum(j.items.map(i=>i.eleves.length))>1?'s':''} à la direction. Les points clôturés ne se modifient plus.</small></span></div>`;

/* Fil Activité */
function seenGet(){try{return localStorage.getItem('clr-seen')||''}catch(e){return ''}}
function seenSet(v){try{localStorage.setItem('clr-seen',v)}catch(e){}}
function events(){const out=[];for(const j of Object.values(S.journal)){if(!S.classes[j.classeId])continue;if(j.appel)out.push({t:'appel',j,at:j.appel.at,e:j.appel});if(j.cotes)out.push({t:'cotes',j,at:j.cotes.at,e:j.cotes})}return out.sort((a,b)=>(b.at||'').localeCompare(a.at||''))}
function unseen(){const s=seenGet();return events().filter(x=>!s||x.at>s).length}
function personOf(id,cid){const all=ensList();return all.find(p=>p.id===id)||teachersOf(cid)[0]||{nom:'Enseignant',id:''}}

  const cards=evs.map(x=>{const p=personOf(x.e.by,x.j.classeId);const c=S.classes[x.j.classeId];const nw=seen&&x.at>seen;

      ${(()=>{const g=gfSplit(x.j.classeId,x.j.date);return `<div class="gfrow num"><span><i class="gb">G</i> ${g.PG} présent${g.PG>1?'s':''} · ${g.AG} absent${g.AG>1?'s':''}</span><span><i class="gf">F</i> ${g.PF} présente${g.PF>1?'s':''} · ${g.AF} absente${g.AF>1?'s':''}</span></div>`})()}
      ${x.e.absents?.length?`<div class="act-l"><small>Absents :</small> ${x.e.absents.map(h).join(', ')}</div>`:''}</article>`;
    const tot=sum((x.e.items||[]).map(i=>i.eleves.length));

      ${(x.e.items||[]).map(it=>{const ok=it.eleves.filter(e=>e.pts!=null);const moy=ok.length?sum(ok.map(e=>e.pts))/ok.length:null;return `<details class="act-d"><summary><span class="grow"><b>${h(it.nom)}</b><small>${keyLbl(it.key)} · /${fmt(it.max)}</small></span><span class="num muted small">${it.eleves.length} élève${it.eleves.length>1?'s':''} · moy. ${fmt(moy)}</span></summary>
        <ol>${it.eleves.map(e=>`<li><span>${h(e.nom)}</span><b class="num ${e.pts!=null&&e.pts<it.max/2?'low':''}">${e.pts==null?'–':fmt(e.pts)} / ${fmt(it.max)}</b></li>`).join('')}</ol></details>`}).join('')}</article>`;
  }).join('');
  return band({back:'accueil',kicker:'Direction et surécole',title:'Activité',sub:`Aujourd’hui : appel clôturé dans ${tdA} classe${tdA>1?'s':''} sur ${ids.length} · cotes clôturées dans ${tdC}`})+page(`

const REAL={};
function startSim(){S.sim=true;S.demo=true;S.demoRole='dir';const d=simData();
  const ri=REAL.inscriptions||{},ra=REAL.affectations||{};const realCls=new Set(Object.values(ra).flatMap(x=>x.classes||[]));
  if(Object.keys(ri).length){
    // garder les vrais enseignants ; garder les classes réelles si elles existent
    for(const [id,a] of Object.entries(d.affect))if((a.classes||[]).some(c=>realCls.has(c))){delete d.affect[id];delete d.inscr[id]}
    delete d.inscr['sim-new'];
    d.inscr={...d.inscr,...ri};d.affect={...d.affect,...ra};
    if(REAL.classes&&Object.keys(REAL.classes).length)d.classes={...d.classes,...REAL.classes};
  }

  const t6=Object.entries(S.affect).find(([id,a])=>(a.classes||[]).includes('6ap')&&S.inscr[id]);S.demoEns=t6?t6[0]:'demo-ens';

async function boot(){
  render();
  try{if(window.claude?.use)[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
  if(!db){demoData();if(location.hash==='#apercu-enseignant')startPreview();return}
  try{S.me.id=await user?.id()??null;S.me.dir=!!(await user?.canEdit())}catch(e){}
  const seen=new Set(),n=Object.keys(COLS).length;
  const arrive=col=>{seen.add(col);if(!S.ready&&seen.size>=n){S.ready=true;if(location.hash==='#apercu-enseignant')startPreview();else render();setTimeout(autoClose,2500)}};
  for(const col of Object.keys(COLS)){
    db.collection(col).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]=d.data());REAL[col]=m;if(S.sim)return;S[COLS[col]]=m;
      if(!S.ready)arrive(col);else onData(COLS[col])},
     err=>{toast('Connexion aux données perdue. Rechargez la page.');arrive(col)});
  }
}

function applyFit(){document.querySelectorAll('.fitbox').forEach(b=>{const ob=b.querySelector('.ob');if(!ob)return;ob.style.zoom='';const W=b.clientWidth-2;let z=Math.min(1.25,W/ob.scrollWidth*.985);ob.style.zoom=z.toFixed(3);const over=ob.getBoundingClientRect().right-b.getBoundingClientRect().right;if(over>0){z=z*W/(W+over);ob.style.zoom=z.toFixed(3)}})}
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(applyFit,80)});

  if(FS.open&&(key==='notes'||key==='sigs'))renderFS(false);
  if(key==='notes'&&S.view==='classe'&&(S.ctab==='cotes'||S.ctab==='bul')){S.ctab==='cotes'?refreshCotes():refreshBul();return}

function startIntro(){
  const el=$('#intro');
  el.innerHTML=`<div class="intro-in"><div class="intro-tile"><div class="intro-logo">${LOGO_SVG}</div></div><div class="intro-name">Collège La Rivière</div><div class="intro-motto">Discipline · Unité · Travail</div></div>`;
  el.hidden=false;const sv=el.querySelector('svg');try{sv.pauseAnimations();sv.setCurrentTime(0)}catch(e){}
  let first=true;try{first=localStorage.getItem('clr-intro')!==today();localStorage.setItem('clr-intro',today())}catch(e){}
  setTimeout(endIntro,first?8000:2000);
}
let dustRAF=0;
function papers(cv){
  const ctx=cv.getContext('2d');const dpr=Math.min(2,devicePixelRatio||1);let W=0,H=0;
  const size=()=>{W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};size();
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const mk=(y)=>{const z=rnd(.35,1);return{x:rnd(-.1,1.1)*W,y:y??rnd(-.2,1)*H,w:rnd(22,58)*z,h:0,z,rot:rnd(0,6.28),vr:rnd(-.012,.012),flip:rnd(0,6.28),vf:rnd(.01,.03),vy:rnd(.18,.55)*z,sway:rnd(.4,1.4),ph:rnd(0,6.28),a:rnd(.1,.26)*z}};
  const P=Array.from({length:Math.round(Math.min(18,8+W/60))},()=>mk());P.forEach(p=>p.h=p.w*1.3);
  const tick=()=>{if(!document.getElementById('papers')){cancelAnimationFrame(dustRAF);return}
    ctx.clearRect(0,0,W,H);
    for(const p of P){p.y+=p.vy;p.ph+=.012;p.x+=Math.sin(p.ph)*p.sway*.5;p.rot+=p.vr;p.flip+=p.vf;
      if(p.y>H+60){Object.assign(p,mk(-60));p.h=p.w*1.3}
      const sx=Math.cos(p.flip);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(Math.max(.12,Math.abs(sx)),1);
      ctx.globalAlpha=p.a;ctx.fillStyle=sx>0?'#e8edf2':'#c9d1da';ctx.filter=p.z<.6?'blur(1.6px)':'blur(.4px)';
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.globalAlpha=p.a*.5;ctx.fillStyle='#7d8894';for(let l=0;l<4;l++)ctx.fillRect(-p.w/2+p.w*.14,-p.h/2+p.h*(.2+l*.16),p.w*(l===3?.45:.72),Math.max(1,p.h*.03));
      ctx.restore()}
    ctx.filter='none';dustRAF=requestAnimationFrame(tick)};
  addEventListener('resize',size);tick();
}
function endIntro(){const el=$('#intro');if(el.hidden||el.classList.contains('out'))return;el.classList.add('out');setTimeout(()=>{cancelAnimationFrame(dustRAF);el.hidden=true;el.innerHTML='';el.classList.remove('out')},620)}
startIntro();
boot();
