<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Discuter avec nous</title><meta name="description" content="Écrivez-nous, notre assistant vous répond tout de suite.">
<meta name="theme-color" content="#03100E"><link rel="icon" href="/icon-192-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#03100E;--panel:#08201C;--panel2:#0F2E29;--line:rgba(200,240,74,.10);--text:#F1FBF7;--muted:#A6C4BC;--acc:#C8F04A;--acc2:#2EE0B0;--grad:linear-gradient(135deg,#E9FF8A,#C8F04A 50%,#2EE0B0)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:var(--text);font-family:Montserrat,system-ui,sans-serif}
body{display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:radial-gradient(120% 50% at 50% -10%,rgba(46,224,176,.18),transparent 60%),var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line);background:rgba(3,16,14,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}
.av{width:44px;height:44px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-family:Poppins;font-weight:700;color:#03100E;font-size:19px;position:relative;flex:none}
.av::after{content:"";position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:50%;background:#3BE07A;border:2px solid var(--ink)}
.hd{flex:1;min-width:0}.hd b{display:block;font-family:Poppins;font-size:16.5px}.hd small{font-size:12px;color:var(--muted)}
.tag{flex:none;font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:rgba(200,240,74,.12);color:var(--acc);border:1px solid rgba(200,240,74,.3)}
main{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.day{align-self:center;font-size:11px;color:var(--muted);padding:4px 10px;border-radius:999px;background:var(--panel);margin:4px 0}
.b{max-width:82%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--panel2);font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;animation:pop .28s cubic-bezier(.2,.9,.3,1.2) both}
.b.me{align-self:flex-end;border-radius:18px 18px 6px 18px;background:var(--grad);color:#03100E;font-weight:500}
.b.admin{border:1px solid rgba(200,240,74,.35)}.b .who{display:block;font-size:10.5px;font-weight:700;color:var(--acc);margin-bottom:2px}
.b small{display:block;font-size:10px;opacity:.6;margin-top:4px;text-align:right}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
.typing{display:inline-flex;gap:5px;padding:14px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 6px}.sugg button{font:inherit;font-size:12.5px;font-weight:600;color:var(--text);background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:999px}
.card{align-self:stretch;padding:12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:8px}
.card .r{display:flex;gap:8px}.card input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
.card button{font:inherit;font-weight:700;font-size:13px;border:0;border-radius:12px;padding:0 14px;background:var(--grad);color:#03100E}
.card .x{background:none;color:var(--muted);padding:0 4px}
footer{padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:rgba(3,16,14,.92);display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:120px;min-height:46px;font:inherit;font-size:15px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px 16px;outline:none}
textarea:focus{border-color:rgba(200,240,74,.45)}
#send{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--grad);color:#03100E;display:grid;place-items:center}#send:disabled{opacity:.45}#send svg{width:20px;height:20px}
.note{font-size:10.5px;color:var(--muted);text-align:center;padding:0 16px 6px}
</style></head><body>
<header><div class="av" id="av">K</div><div class="hd"><b id="nm">Koris</b><small>En ligne · répond en quelques secondes</small></div><span class="tag">Assistant IA</span></header>
<main id="m" aria-live="polite"></main>
<p class="note">Vous discutez avec un assistant virtuel. Un membre de l'équipe peut aussi vous répondre ici.</p>
<footer><textarea id="t" rows="1" maxlength="1200" placeholder="Écrivez votre message…" aria-label="Votre message"></textarea><button id="send" aria-label="Envoyer" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></footer>
<script>
(function(){
const FN='https://eebqtggnmuzfrwgunpsa.supabase.co/functions/v1/accueil',KEY='sb_publishable_lOSLDkJ_SGGKmW5dnLQTig_i8Wa-Vp0';
const $=s=>document.querySelector(s),M=$('#m'),T=$('#t'),B=$('#send');
const st=k=>{try{return JSON.parse(localStorage.getItem('kd:'+k))}catch(_){return null}},sv=(k,v)=>{try{localStorage.setItem('kd:'+k,JSON.stringify(v))}catch(_){}};
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:r&3|8).toString(16)});
const vid=st('vid')||uuid();sv('vid',vid);
let msgs=st('msgs')||[],last=st('last')||0,cfg={name:'Koris',welcome:'Bonjour 👋 Comment puis-je vous aider ?'},busy=false;
const src=(new URLSearchParams(location.search).get('src')||document.referrer.replace(/^https?:\/\/(www\.)?/,'').split('/')[0]||'direct').slice(0,60);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
async function call(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);return r.json()}
function draw(){M.innerHTML=`<span class="day">Aujourd'hui</span><div class="b">${esc(cfg.welcome)}</div>`+
  (msgs.length?'':`<div class="sugg">${['Comment ça marche ?','Quels sont vos prix ?','Je veux m\'inscrire'].map(s=>`<button type="button">${esc(s)}</button>`).join('')}</div>`)+
  msgs.map(m=>`<div class="b ${m.role==='user'?'me':m.role==='admin'?'admin':''}">${m.role==='admin'?`<span class="who">${esc(cfg.name)} · équipe</span>`:''}${esc(m.text)}<small>${hm(m.at)}</small></div>`).join('')+
  (msgs.filter(m=>m.role==='user').length>=2&&!st('contact')?`<div class="card" id="ct"><b>Pour qu'on puisse vous recontacter (facultatif)</b><div class="r"><input id="cn" placeholder="Prénom" maxlength="60"><input id="cp" type="tel" placeholder="Numéro WhatsApp" maxlength="20" inputmode="tel"></div><div class="r" style="justify-content:flex-end"><button class="x" id="cx" type="button">Plus tard</button><button id="cs" type="button" style="height:38px">Envoyer</button></div></div>`:'')+
  (busy?'<div class="b typing"><i></i><i></i><i></i></div>':'');
  M.querySelectorAll('.sugg button').forEach(b=>b.onclick=()=>send(b.textContent));
  const cs=$('#cs');if(cs){cs.onclick=()=>{const n=$('#cn').value.trim(),p=$('#cp').value.trim();if(!n&&!p)return;sv('contact',{n,p});send(`Je m'appelle ${n||'—'}${p?', mon numéro : '+p:''}`,{name:n,phone:p})};$('#cx').onclick=()=>{sv('contact',{skip:1});draw()}}
  requestAnimationFrame(()=>M.scrollTop=M.scrollHeight)}
async function send(text,extra){text=String(text||'').trim();if(!text||busy)return;msgs.push({role:'user',text,at:Date.now()});sv('msgs',msgs);T.value='';fit();B.disabled=true;busy=true;draw();
  try{const r=await call({action:'send',vid,text,src,...(extra||{})});if(r.reply){msgs.push({role:'ai',text:r.reply,at:r.at||Date.now()});last=Math.max(last,r.at||0)}}
  catch(_){msgs.push({role:'ai',text:"Oups, le message n'est pas passé. Vérifiez votre connexion et réessayez.",at:Date.now(),err:1})}
  busy=false;sv('msgs',msgs.slice(-150));sv('last',last);draw()}
async function poll(){if(document.hidden||busy)return;try{const r=await call({action:'poll',vid,since:last});(r.msgs||[]).forEach(m=>{if(!msgs.some(x=>x.at===m.at&&x.text===m.text)){msgs.push(m)}last=Math.max(last,m.at)});if((r.msgs||[]).length){sv('msgs',msgs);sv('last',last);draw()}}catch(_){}}
function fit(){T.style.height='auto';T.style.height=Math.min(120,T.scrollHeight)+'px';B.disabled=!T.value.trim()}
T.addEventListener('input',fit);T.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();send(T.value)}});B.onclick=()=>send(T.value);
call({action:'config'}).then(c=>{cfg={...cfg,...c};$('#nm').textContent=cfg.name;$('#av').textContent=(cfg.name||'K').trim()[0].toUpperCase();document.title='Discuter avec '+cfg.name;draw()}).catch(()=>{});
draw();setInterval(poll,6000);
})();
</script></body></html>
