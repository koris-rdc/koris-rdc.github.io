# Mise à jour automatique de Supabase depuis GitHub.
# Secret nécessaire dans le dépôt : SUPABASE_ACCESS_TOKEN
# (Supabase → Account → Access Tokens). GitHub le garde caché : il n'apparaît jamais dans les journaux.
#  • une fonction modifiée dans supabase/functions/<nom>/ est redéployée ;
#  • un nouveau fichier supabase/sql/*.sql est exécuté une fois sur la base.
# Les résultats SQL s'affichent dans le journal PUBLIC : les scripts ne doivent renvoyer que des totaux.
name: Supabase
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/sql/**"]
  workflow_dispatch:
    inputs:
      fonction:
        description: "Fonction à redéployer (accueil, gucko, koris-ia, push) — vide = aucune"
        required: false
      sql:
        description: "Fichier SQL à exécuter (ex. supabase/sql/2026-11-07-test.sql) — vide = aucun"
        required: false
concurrency: supabase
env:
  PROJECT_REF: eebqtggnmuzfrwgunpsa
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Secret présent ?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Ajoute le secret SUPABASE_ACCESS_TOKEN dans Settings → Secrets and variables → Actions"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Liste des changements
        id: ch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            F="${{ github.event.inputs.fonction }}"; S="${{ github.event.inputs.sql }}"
          else
            F=$(git diff --name-only HEAD~1 HEAD -- supabase/functions | cut -d/ -f3 | sort -u | tr '\n' ' ')
            S=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'supabase/sql/*.sql' | tr '\n' ' ')
          fi
          echo "fonctions=$F" >> "$GITHUB_OUTPUT"; echo "sql=$S" >> "$GITHUB_OUTPUT"
          echo "Fonctions : ${F:-aucune} · SQL : ${S:-aucun}"
      - name: Déployer les fonctions
        if: steps.ch.outputs.fonctions != ''
        run: |
          for f in ${{ steps.ch.outputs.fonctions }}; do
            [ -f "supabase/functions/$f/index.ts" ] || continue
            flag=""; grep -q "SANS vérification JWT" "supabase/functions/$f/index.ts" && flag="--no-verify-jwt"
            echo "→ déploiement de $f $flag"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" $flag
          done
      - name: Exécuter les scripts SQL
        if: steps.ch.outputs.sql != ''
        run: |
          for s in ${{ steps.ch.outputs.sql }}; do
            [ -f "$s" ] || continue
            echo "→ exécution de $s"
            body=$(jq -Rs '{query: .}' < "$s")
            code=$(curl -sS -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
            echo "HTTP $code"; head -c 3000 out.json; echo
            [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || exit 1
          done
